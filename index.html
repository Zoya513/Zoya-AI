<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOYA AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%}
body{font-family:Arial,sans-serif;background:#fff;color:#202123}
.zora{width:100%;max-width:900px;height:650px;margin:0 auto;display:flex;flex-direction:column;background:#fff;overflow:hidden}
:root{--zora-logo:url("https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w1000")}
.header{height:64px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #eee;flex-shrink:0}
.logo,.avatar,.welcome-logo{background-image:var(--zora-logo);background-repeat:no-repeat;background-size:270%;background-position:center 38%;background-color:#111;overflow:hidden}
.logo{width:38px;height:38px;border-radius:12px;margin-right:12px;flex-shrink:0}
.title{font-size:18px;font-weight:600}.status{margin-left:10px;font-size:12px;color:#777}
.chat{flex:1;overflow-y:auto;padding:30px 22px;scroll-behavior:smooth}
.message{display:flex;margin-bottom:28px;width:100%}
.message.user{justify-content:flex-end}.message.ai{justify-content:flex-start}
.avatar{width:32px;height:32px;border-radius:10px;margin-right:10px;flex-shrink:0}
.bubble{max-width:75%;line-height:1.6;font-size:15px;overflow-wrap:anywhere}
.user .bubble{background:#f0f0f0;padding:12px 16px;border-radius:18px;white-space:pre-wrap}
.ai .bubble{white-space:normal}.ai .bubble strong{font-weight:700}.ai .bubble em{font-style:italic}
.ai .bubble .ai-heading{display:block;font-weight:700;margin-top:8px;margin-bottom:3px}
.ai .bubble code{background:#f1f1f1;padding:2px 5px;border-radius:5px;font-family:monospace;font-size:13px}
.ai .bubble .ai-code-block{display:block;background:#f5f5f5;padding:10px 12px;margin:8px 0;border-radius:8px;font-family:monospace;white-space:pre-wrap;overflow-x:auto}
.ai .bubble .ai-bullet,.ai .bubble .ai-number{display:block;margin-left:4px;padding-left:4px}
.welcome{text-align:center;margin-top:100px}.welcome-logo{width:65px;height:65px;margin:auto;border-radius:20px}
.welcome h1{margin-top:20px;margin-bottom:8px;font-size:26px}.welcome p{color:#777;font-size:14px}
.loading{display:none;font-size:14px;color:#888;margin-left:64px;margin-bottom:12px;flex-shrink:0}
.dot{animation:blink 1.4s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.input-area{padding:15px 20px 20px;flex-shrink:0}
.input-box{display:flex;align-items:center;border:1px solid #d9d9d9;border-radius:18px;padding:7px 8px 7px 16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04)}
#question{flex:1;border:none;outline:none;font-size:15px;resize:none;font-family:inherit;min-height:42px;max-height:150px;padding-top:11px;background:transparent;color:#202123}
#question::placeholder{color:#999}
#mic,#send{width:40px;height:40px;border:none;border-radius:12px;cursor:pointer;font-size:18px;flex-shrink:0}
#mic{background:#f1f1f1;color:#111;margin-right:6px;transition:.2s}#mic:hover{background:#e7e7e7}
#mic:active,#send:active{transform:scale(.95)}#mic.listening{background:#111;color:#fff}
#mic:disabled,#send:disabled{opacity:.4;cursor:not-allowed}
#send{background:#111;color:#fff;transition:.2s}#send:hover{opacity:.85}
#voiceStatus{display:none;font-size:12px;color:#777;margin:0 20px 8px 24px}
#voiceStatus.active{display:block}
.retry-status{font-size:13px;color:#888;margin-left:64px;margin-bottom:15px;display:none}
@media(max-width:600px){
.zora{height:100vh;height:100dvh}.header{height:64px;padding:0 18px}.chat{padding:20px 15px}
.bubble{max-width:85%}.welcome{margin-top:80px}.welcome h1{font-size:23px}
.input-area{padding:10px 12px 14px}
}
</style>
</head>
<body>
<div class="zora">
<div class="header"><div class="logo"></div><div class="title">ZOYA AI</div><div class="status">AI Assistant</div></div>

<div class="chat" id="chat">
<div class="welcome" id="welcome"><div class="welcome-logo"></div><h1>Apa yang bisa saya bantu?</h1><p>Tanyakan sesuatu kepada ZOYA AI</p></div>
</div>

<div class="loading" id="loading">ZOYA sedang berpikir <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
<div class="retry-status" id="retryStatus">Mencoba menghubungkan kembali...</div>
<div id="voiceStatus"></div>

<div class="input-area">
<div class="input-box">
<textarea id="question" placeholder="Tanya apa saja..." rows="1" autocomplete="off"></textarea>
<button id="mic" type="button" aria-label="Voice input" title="Bicara">🎤</button>
<button id="send" type="button" aria-label="Kirim">↑</button>
</div>
</div>
</div>

<script>
const BACKEND_URL="https://script.google.com/macros/s/AKfycbw33TXwySs86gmsMloKyXFSXiaQx38nnn-7Lo8-af-BK6nnchC2wGH52ogF-aVit1j7Cg/exec";
const MEMORY_KEY="ZORA_AI_MEMORY_V8";
const MAX_HISTORY_MESSAGES=8,MAX_HISTORY_CHARS=1200,MAX_RETRIES=3,REQUEST_TIMEOUT=45000;

let conversationHistory=[],isSending=false,recognition=null,isListening=false,voiceBaseText="",voiceStarting=false;

const questionInput=document.getElementById("question");
const chat=document.getElementById("chat");
const loading=document.getElementById("loading");
const sendButton=document.getElementById("send");
const micButton=document.getElementById("mic");
const welcome=document.getElementById("welcome");
const retryStatus=document.getElementById("retryStatus");
const voiceStatus=document.getElementById("voiceStatus");

function loadMemory(){
 try{
  const saved=localStorage.getItem(MEMORY_KEY);if(!saved)return;
  const data=JSON.parse(saved);if(!Array.isArray(data))return;
  conversationHistory=data.filter(x=>x&&(x.role==="user"||x.role==="assistant")&&typeof x.text==="string"&&x.text.trim()).slice(-MAX_HISTORY_MESSAGES);
 }catch(e){console.error("Memory:",e);conversationHistory=[]}
}
function saveMemory(){
 try{conversationHistory=conversationHistory.slice(-MAX_HISTORY_MESSAGES);localStorage.setItem(MEMORY_KEY,JSON.stringify(conversationHistory))}
 catch(e){console.error("Save memory:",e)}
}
function prepareHistory(history){
 if(!Array.isArray(history))return [];
 return history.slice(-MAX_HISTORY_MESSAGES).map(x=>{
  let text=String(x.text||"");if(text.length>MAX_HISTORY_CHARS)text=text.substring(0,MAX_HISTORY_CHARS)+"...";
  return {role:x.role,text:text};
 });
}
function formatAIResponse(text){
 if(!text)return "";
 let s=String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
 s=s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre class="ai-code-block">'+c.trim()+"</pre>");
 s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
 s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/__(.+?)__/g,"<strong>$1</strong>");
 s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>").replace(/(^|[^_])_([^_\n]+)_(?!_)/g,"$1<em>$2</em>");
 s=s.replace(/^###\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^##\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^#\s+(.+)$/gm,'<span class="ai-heading">$1</span>');
 s=s.replace(/^[ \t]*[-*+]\s+(.+)$/gm,'<span class="ai-bullet">• $1</span>').replace(/^[ \t]*(\d+)\.\s+(.+)$/gm,'<span class="ai-number">$1. $2</span>');
 return s.replace(/\n/g,"<br>");
}
function addMessage(text,type){
 const message=document.createElement("div");message.className="message "+type;
 if(type==="ai"){const avatar=document.createElement("div");avatar.className="avatar";message.appendChild(avatar)}
 const bubble=document.createElement("div");bubble.className="bubble";
 if(type==="ai")bubble.innerHTML=formatAIResponse(text);else bubble.textContent=String(text||"");
 message.appendChild(bubble);chat.appendChild(message);
 requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight);
}
function createCallbackName(){return "zoraCallback_"+Date.now()+"_"+Math.random().toString(36).substring(2,10)}
function askZora(question,history){
 return new Promise((resolve,reject)=>{
  const callbackName=createCallbackName(),script=document.createElement("script");
  let finished=false,timeoutId=null;
  function cleanup(){if(timeoutId)clearTimeout(timeoutId);timeoutId=null;if(script.parentNode)script.parentNode.removeChild(script);try{delete window[callbackName]}catch(e){window[callbackName]=undefined}}
  function finish(data){if(finished)return;finished=true;cleanup();if(!data||data.success!==true){reject(new Error(data&&data.error?String(data.error):"Backend ZORA tidak memberikan jawaban."));return}resolve(data)}
  window[callbackName]=finish;
  script.onerror=()=>{if(finished)return;finished=true;cleanup();reject(new Error("Browser tidak menerima response dari Google Apps Script."))};
  const params=new URLSearchParams();params.set("q",String(question));params.set("history",JSON.stringify(prepareHistory(history)));params.set("callback",callbackName);params.set("_",String(Date.now()));
  script.src=BACKEND_URL+"?"+params.toString();script.async=true;document.body.appendChild(script);
  timeoutId=setTimeout(()=>{if(finished)return;finished=true;cleanup();reject(new Error("Response ZORA terlalu lama."))},REQUEST_TIMEOUT);
 });
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function askZoraWithRetry(question,history){
 let lastError=null;
 for(let attempt=1;attempt<=MAX_RETRIES;attempt++){
  try{
   if(attempt>1){retryStatus.style.display="block";retryStatus.textContent="Mencoba menghubungkan kembali ("+attempt+"/"+MAX_RETRIES+")..."}
   const result=await askZora(question,history);retryStatus.style.display="none";return result;
  }catch(e){console.error("Attempt:",e);lastError=e;if(attempt<MAX_RETRIES)await wait(attempt*1500)}
 }
 retryStatus.style.display="none";throw lastError||new Error("ZORA gagal memberikan response.");
}
async function sendMessage(){
 if(isSending)return;
 const question=questionInput.value.trim();if(!question)return;
 if(isListening)stopVoice();
 isSending=true;sendButton.disabled=true;micButton.disabled=true;
 if(welcome&&welcome.parentNode)welcome.remove();
 addMessage(question,"user");
 const historyToSend=prepareHistory(conversationHistory);
 questionInput.value="";autoResizeTextarea();loading.style.display="block";retryStatus.style.display="none";
 try{
  const result=await askZoraWithRetry(question,historyToSend),answer=String(result.answer||"").trim();
  if(!answer)throw new Error("ZORA mengembalikan jawaban kosong.");
  conversationHistory.push({role:"user",text:question},{role:"assistant",text:answer});saveMemory();addMessage(answer,"ai");
 }catch(e){console.error("ZORA:",e);addMessage("ZORA belum menerima respons dari server.\n\n"+(e.message||"Unknown error"),"ai")}
 finally{loading.style.display="none";retryStatus.style.display="none";sendButton.disabled=false;micButton.disabled=false;isSending=false;questionInput.focus()}
}

/* VOICE: biarkan SpeechRecognition sendiri yang memicu permission browser */
function setVoiceStatus(text,active=true){voiceStatus.textContent=text;voiceStatus.classList.toggle("active",active)}
function stopVoice(){if(recognition){try{recognition.stop()}catch(e){}}}

function setupVoiceInput(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  micButton.addEventListener("click",()=>alert("Speech-to-Text tidak didukung browser ini.\n\nGunakan Google Chrome atau Microsoft Edge terbaru."));
  return;
 }
 recognition=new SpeechRecognition();
 recognition.lang="id-ID";recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;

 recognition.onstart=()=>{
  voiceStarting=false;isListening=true;voiceBaseText=questionInput.value.trim();
  micButton.classList.add("listening");micButton.textContent="⏹";micButton.title="Berhenti mendengarkan";
  setVoiceStatus("🎙️ Silakan bicara...");console.log("VOICE: START");
 };
 recognition.onresult=event=>{
  let finalText="",interimText="";
  for(let i=event.resultIndex;i<event.results.length;i++){
   const t=event.results[i][0].transcript;
   if(event.results[i].isFinal)finalText+=t;else interimText+=t;
  }
  finalText=finalText.trim();interimText=interimText.trim();
  const combined=(voiceBaseText?(voiceBaseText+" "):"")+finalText+(interimText?(" "+interimText):"");
  if(combined.trim()){questionInput.value=combined.trim();autoResizeTextarea();setVoiceStatus(finalText?"📝 "+finalText:"🎙️ "+interimText)}
 };
 recognition.onerror=event=>{
  console.error("VOICE ERROR:",event.error);
  if(event.error==="not-allowed")setVoiceStatus("❌ Microphone ditolak. Klik ikon 🔒 di address bar → Microphone → Allow, lalu reload halaman.");
  else if(event.error==="no-speech")setVoiceStatus("🎙️ Tidak ada suara terdeteksi. Klik 🎤 lalu bicara.");
  else if(event.error==="audio-capture")setVoiceStatus("❌ Microphone tidak ditemukan atau sedang digunakan aplikasi lain.");
  else if(event.error==="network")setVoiceStatus("❌ Speech Recognition mengalami masalah jaringan.");
  else setVoiceStatus("❌ Speech-to-Text error: "+event.error);
 };
 recognition.onend=()=>{
  voiceStarting=false;isListening=false;micButton.classList.remove("listening");micButton.textContent="🎤";micButton.title="Bicara";console.log("VOICE: END");
  setTimeout(()=>{if(!isListening&&!voiceStatus.textContent.startsWith("❌"))voiceStatus.classList.remove("active")},1500);
 };
 micButton.addEventListener("click",()=>{
  if(isSending)return;
  if(isListening){stopVoice();return}
  if(voiceStarting)return;
  voiceStarting=true;voiceBaseText=questionInput.value.trim();
  try{recognition.start()}
  catch(e){
   voiceStarting=false;console.error("VOICE START:",e);
   if(e.name==="InvalidStateError")setTimeout(()=>{if(!isListening){try{voiceStarting=true;recognition.start()}catch(x){voiceStarting=false}}},500);
   else setVoiceStatus("❌ Gagal memulai microphone: "+e.message);
  }
 });
}

function autoResizeTextarea(){questionInput.style.height="auto";questionInput.style.height=Math.min(questionInput.scrollHeight,150)+"px"}
questionInput.addEventListener("input",autoResizeTextarea);

/* ENTER: desktop dan keyboard eksternal */
questionInput.addEventListener("keydown",event=>{
 if((event.key==="Enter"||event.code==="Enter")&&!event.shiftKey){
  event.preventDefault();event.stopImmediatePropagation();sendMessage();
 }
});

sendButton.addEventListener("click",sendMessage);
loadMemory();setupVoiceInput();autoResizeTextarea();

console.log("ZOYA AI FRONTEND V8 AKTIF");
console.log("VOICE: SpeechRecognition");
console.log("ENTER: ACTIVE");
window.sendMessage=sendMessage;
</script>
</body>
</html>
