ve")}else help("Speech-to-Text gagal: "+e.error)};recognition.onend=()=>{isListening=false;micButton.classList.remove("listening");micButton.textContent="🎤";if(!voicePermission.classList.contains("active"))setTimeout(()=>voiceStatus.classList.remove("active"),1200)};micButton.onclick=async()=>{if(isSending)return;if(isListening){recognition.stop();return}if(await permission()){voiceBaseText=questionInput.value.trim();try{recognition.start()}catch(e){setTimeout(()=>{try{if(!isListening)recognition.start()}catch(x){}},300)}}}}

/* =========================================================
   DOCUMENT UPLOAD — FINAL POST CHUNK VERSION
   =========================================================
   PENTING:
   - init/complete/status memakai GET + JSONP karena kecil.
   - DATA FILE memakai POST body, BUKAN URL.
   - Ini menghilangkan error "Browser tidak menerima respons"
     akibat base64 dimasukkan ke query URL.
   ========================================================= */

const MAX_UPLOAD_BYTES = 25 * 1024 * 1024;
const UPLOAD_CHUNK_BYTES = 64 * 1024;

const ALLOWED_UPLOAD_EXTENSIONS = [
  "pdf","txt","doc","docx","xls","xlsx","csv",
  "ppt","pptx","jpg","jpeg","png","webp"
];

function createUploadCallback(){
  return (
    "zoraUploadCallback_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2,10)
  );
}

/*
 * GET kecil -> JSONP.
 * Dipakai untuk init, status, complete, abort.
 */
function uploadJsonp(params,timeoutMs=60000){

  return new Promise(function(resolve,reject){

    const cb = createUploadCallback();
    const script = document.createElement("script");

    let finished = false;
    let timer = null;

    function cleanup(){

      if(timer){
        clearTimeout(timer);
        timer = null;
      }

      if(script && script.parentNode){
        script.parentNode.removeChild(script);
      }

      try{
        delete window[cb];
      }catch(e){
        window[cb] = undefined;
      }
    }

    function fail(message){

      if(finished) return;

      finished = true;
      cleanup();

      reject(new Error(message));
    }

    window[cb] = function(data){

      if(finished) return;

      finished = true;
      cleanup();

      if(!data || data.success !== true){

        reject(
          new Error(
            data && data.error
              ? String(data.error)
              : "Backend upload tidak memberikan respons sukses."
          )
        );

        return;
      }

      resolve(data);
    };

    script.async = true;

    script.onerror = function(){

      fail(
        "Browser tidak menerima respons upload dari Google Apps Script."
      );
    };

    const query = new URLSearchParams();

    Object.keys(params).forEach(function(key){

      if(
        params[key] !== undefined &&
        params[key] !== null
      ){
        query.set(
          key,
          String(params[key])
        );
      }
    });

    query.set("callback",cb);
    query.set("_",String(Date.now()));

    script.src =
      BACKEND_URL +
      "?" +
      query.toString();

    document.body.appendChild(script);

    timer = setTimeout(function(){

      fail(
        "Server tidak memberikan respons dalam waktu yang ditentukan."
      );

    },timeoutMs);

  });
}

/*
 * POST chunk menggunakan HTML form + iframe.
 *
 * Tidak menggunakan fetch() karena frontend berada
 * di GitHub/Google Sites dan Apps Script tidak memberikan
 * CORS response yang bisa dibaca browser.
 *
 * Form POST lintas origin diperbolehkan browser.
 */
function postUploadChunk(
  sessionId,
  chunkIndex,
  totalChunks,
  base64Data
){

  return new Promise(function(resolve,reject){

    const frameName =
      "zoraUploadFrame_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2,8);

    const iframe =
      document.createElement("iframe");

    iframe.name = frameName;
    iframe.style.display = "none";

    document.body.appendChild(iframe);

    const form =
      document.createElement("form");

    form.method = "POST";
    form.action = BACKEND_URL;
    form.target = frameName;
    form.enctype =
      "application/x-www-form-urlencoded";
    form.style.display = "none";

    function addField(name,value){

      const input =
        document.createElement("input");

      input.type = "hidden";
      input.name = name;
      input.value = value;

      form.appendChild(input);
    }

    addField(
      "action",
      "upload_chunk"
    );

    addField(
      "sessionId",
      sessionId
    );

    addField(
      "chunkIndex",
      chunkIndex
    );

    addField(
      "totalChunks",
      totalChunks
    );

    addField(
      "data",
      base64Data
    );

    document.body.appendChild(form);

    let finished = false;
    let cancelWatcher = null;

    const timeout =
      setTimeout(function(){

        if(finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "POST chunk timeout."
          )
        );

      },60000);

    function cleanup(){

      clearTimeout(timeout);

      if(cancelWatcher){
        clearInterval(cancelWatcher);
        cancelWatcher = null;
      }

      if(form.parentNode){
        form.parentNode.removeChild(form);
      }

      setTimeout(function(){

        if(iframe.parentNode){
          iframe.parentNode.removeChild(iframe);
        }

      },1000);
    }

    /*
     * iframe onload hanya berarti response HTTP selesai.
     * Kita TIDAK membaca isi iframe.
     * Status sebenarnya diverifikasi dengan upload_status.
     */
    iframe.onload = function(){

      if(finished) return;

      finished = true;

      cleanup();

      resolve({
        success:true
      });
    };

    iframe.onerror = function(){

      if(finished) return;

      finished = true;

      cleanup();

      reject(
        new Error(
          "POST chunk gagal dikirim ke Google Apps Script."
        )
      );
    };

    form.submit();

    /* Jika user menekan cancel, hentikan menunggu request ini.
       Request HTTP yang sudah terkirim tidak bisa ditarik kembali
       dari browser, tetapi session langsung dibatalkan di server. */
    cancelWatcher = setInterval(function(){
      if(uploadCancelRequested && !finished){
        clearInterval(cancelWatcher);
        finished = true;
        cleanup();
        reject(new Error("UPLOAD_CANCELLED"));
      }
    },100);

  });
}

/*
 * Setelah POST selesai, verifikasi bahwa chunk benar-benar
 * sudah masuk ke Drive melalui upload_status.
 */
async function waitForChunk(
  sessionId,
  chunkIndex
){

  const maxAttempts = 30;

  for(
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ){

    try{

      const result =
        await uploadJsonp({
          action:"upload_status",
          sessionId:sessionId,
          chunkIndex:chunkIndex
        },30000);

      if(result.received === true){
        return result;
      }

    }catch(error){

      console.warn(
        "UPLOAD STATUS RETRY:",
        chunkIndex,
        attempt,
        error
      );
    }

    await wait(500);
  }

  throw new Error(
    "Server tidak mengonfirmasi bagian " +
    (chunkIndex + 1) +
    "."
  );
}

function arrayBufferToBase64(buffer){

  const bytes =
    new Uint8Array(buffer);

  const sliceSize = 0x8000;

  let binary = "";

  for(
    let i = 0;
    i < bytes.length;
    i += sliceSize
  ){

    const slice =
      bytes.subarray(
        i,
        Math.min(
          i + sliceSize,
          bytes.length
        )
      );

    binary +=
      String.fromCharCode.apply(
        null,
        slice
      );
  }

  return btoa(binary);
}

async function uploadFileToBackend(file){

  if(!file){
    throw new Error("File tidak dipilih.");
  }

  if(file.size <= 0){
    throw new Error("File kosong.");
  }

  if(file.size > MAX_UPLOAD_BYTES){
    throw new Error(
      "File terlalu besar. Maksimal 25 MB."
    );
  }

  const totalChunks =
    Math.ceil(
      file.size /
      UPLOAD_CHUNK_BYTES
    );

  let sessionId = null;

  try{

    if(uploadCancelRequested){
      throw new Error("UPLOAD_CANCELLED");
    }

    /* ================================================
       INIT
       ================================================ */

    setUploadUI(
      "📤 Menyiapkan upload " +
      file.name +
      "..."
    );

    showUploadProgress(
      file,
      1
    );

    const init =
      await uploadJsonp({
        action:"upload_init",
        fileName:file.name,
        mimeType:
          file.type ||
          "application/octet-stream",
        fileSize:file.size,
        totalChunks:totalChunks
      });

    sessionId =
      init.sessionId;
    activeUploadSessionId = sessionId;

    if(!sessionId){
      throw new Error(
        "Server tidak memberikan session upload."
      );
    }

    const serverChunkSize =
      Number(init.chunkSize) > 0
        ? Number(init.chunkSize)
        : UPLOAD_CHUNK_BYTES;

    /*
     * Backend V11 menggunakan 64 KB.
     * Jika server memberikan nilai lain,
     * gunakan nilai server.
     */
    const chunkSize =
      Math.min(
        serverChunkSize,
        UPLOAD_CHUNK_BYTES
      );

    const finalTotalChunks =
      Math.ceil(
        file.size /
        chunkSize
      );

    /*
     * ==============================================
     * CHUNK LOOP
     * ==============================================
     */

    for(
      let chunkIndex = 0;
      chunkIndex < finalTotalChunks;
      chunkIndex++
    ){

      if(uploadCancelRequested){
        throw new Error("UPLOAD_CANCELLED");
      }

      const start =
        chunkIndex * chunkSize;

      const end =
        Math.min(
          start + chunkSize,
          file.size
        );

      const blob =
        file.slice(
          start,
          end
        );

      const buffer =
        await blob.arrayBuffer();

      const base64 =
        arrayBufferToBase64(
          buffer
        );

      const progress =
        5 +
        (
          (chunkIndex + 1) /
          finalTotalChunks
        ) * 88;

      showUploadProgress(
        file,
        progress
      );

      setUploadUI(
        "📤 Mengupload bagian " +
        (chunkIndex + 1) +
        " / " +
        finalTotalChunks +
        "..."
      );

      let uploaded = false;
      let lastError = null;

      /*
       * Retry 3x.
       */
      for(
        let attempt = 1;
        attempt <= 3;
        attempt++
      ){

        try{

          if(uploadCancelRequested){
            throw new Error("UPLOAD_CANCELLED");
          }

          /*
           * POST data chunk.
           */
          await postUploadChunk(
            sessionId,
            chunkIndex,
            finalTotalChunks,
            base64
          );

          /*
           * Verifikasi chunk benar-benar
           * tersimpan di Drive.
           */
          await waitForChunk(
            sessionId,
            chunkIndex
          );

          if(uploadCancelRequested){
            throw new Error("UPLOAD_CANCELLED");
          }

          uploaded = true;

          break;

        }catch(error){

          lastError = error;

          console.error(
            "UPLOAD CHUNK ERROR:",
            {
              chunkIndex,
              attempt,
              error
            }
          );

          if(attempt < 3){
            await wait(
              attempt * 1000
            );
          }
        }
      }

      if(!uploaded){

        throw new Error(
          "Gagal mengupload bagian " +
          (chunkIndex + 1) +
          ". " +
          (
            lastError
              ? lastError.message
              : ""
          )
        );
      }
    }

    /* ================================================
       COMPLETE
       ================================================ */

    showUploadProgress(
      file,
      96
    );

    setUploadUI(
      "📦 Menyatukan file di Google Drive..."
    );

    const result =
      await uploadJsonp({
        action:"upload_complete",
        sessionId:sessionId,
        fileName:file.name,
        mimeType:
          file.type ||
          "application/octet-stream"
      },120000);

    showUploadProgress(
      file,
      100
    );

    return result;

  }catch(error){

    if(sessionId){

      try{

        await uploadJsonp({
          action:"upload_abort",
          sessionId:sessionId
        },30000);

      }catch(abortError){

        console.error(
          "UPLOAD ABORT ERROR:",
          abortError
        );
      }
    }

    throw error;
  }
}

async function handleDocumentUpload(file){

  if(!file || isSending) return;

  const ext=file.name.toLowerCase().split(".").pop();

  if(!ALLOWED_UPLOAD_EXTENSIONS.includes(ext) || file.size > MAX_UPLOAD_BYTES){
    documentInput.value="";
    return;
  }

  isSending=true;
  uploadCancelRequested=false;
  activeUploadSessionId=null;
  uploadButton.disabled=true;
  micButton.disabled=true;
  sendButton.disabled=true;
  uploadCancel.disabled=false;

  try{
    showUploadProgress(file,1);
    const result=await uploadFileToBackend(file);

    if(uploadCancelRequested) return;

    showUploadProgress(file,100);

    /* Tidak menambahkan pesan validasi ke chat. */
    setTimeout(function(){
      resetUploadProgress();
    },1200);

  }catch(error){

    if(error && error.message === "UPLOAD_CANCELLED"){
      resetUploadProgress();
      return;
    }

    console.error("ZOYA UPLOAD ERROR:",error);
    resetUploadProgress();

  }finally{
    documentInput.value="";
    activeUploadSessionId=null;
    uploadCancelRequested=false;
    uploadButton.disabled=false;
    micButton.disabled=false;
    sendButton.disabled=false;
    uploadCancel.disabled=false;
    isSending=false;
    questionInput.focus();
  }
}

uploadCancel.onclick = async function(){
  if(!isSending || !activeUploadSessionId) return;

  uploadCancelRequested=true;
  uploadCancel.disabled=true;

  const sessionId=activeUploadSessionId;

  try{
    await uploadJsonp({
      action:"upload_abort",
      sessionId:sessionId
    },30000);
  }catch(error){
    console.warn("UPLOAD CANCEL CLEANUP:",error);
  }

  resetUploadProgress();
};

uploadButton.onclick = function(){

  if(!isSending){
    documentInput.click();
  }
};

documentInput.onchange = function(){

  const file =
    documentInput.files &&
    documentInput.files[0];

  if(file){
    handleDocumentUpload(file);
  }
};
