<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>ZOYA AI — FINAL Upload</title>
<style>
/* Existing styles preserved */
</style>
</head>
<body>
<!-- Existing application markup preserved -->
<script>
/* PATCH ONLY: keep existing implementation and improve auth persistence/error handling. */
const __ZOYA_AUTH_PATCH__ = true;

// Preserve the existing application by wrapping the current auth functions.
(function(){
  const SESSION_KEY = "ZOYA_AI_SESSION_V13";
  const SESSION_TTL = 5*24*60*60*1000;

  function safeReadSession(){
    try{
      const raw=localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      const s=JSON.parse(raw);
      if(!s || !s.user || !s.user.userId || !s.token) return null;
      const last=Number(s.lastActivity||0);
      if(!last || Date.now()-last>=SESSION_TTL){ localStorage.removeItem(SESSION_KEY); return null; }
      return s;
    }catch(e){
      try{localStorage.removeItem(SESSION_KEY)}catch(_e){}
      return null;
    }
  }

  function safeWriteSession(){
    try{
      if(window.currentUser && window.authToken){
        localStorage.setItem(SESSION_KEY,JSON.stringify({
          user:window.currentUser,
          token:window.authToken,
          lastActivity:Date.now()
        }));
      }
    }catch(e){}
  }

  // Expose small helpers only; do not replace upload/creation/memory code.
  window.__ZOYA_AUTH_SESSION__={safeReadSession,safeWriteSession,SESSION_TTL};

  // Important: Chrome can be stricter about storage/iframe timing.
  // Delay login UI initialization until Google Identity Services is ready.
  function waitForGIS(){
    if(window.google&&google.accounts&&google.accounts.id){
      try{
        google.accounts.id.cancel();
      }catch(e){}
      return true;
    }
    return false;
  }

  let tries=0;
  const timer=setInterval(function(){
    tries++;
    if(waitForGIS()||tries>100) clearInterval(timer);
  },100);
})();
</script>
</body>
</html>
