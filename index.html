=s.user;setUser(currentUser);saveSession();return true}catch(e){clearSession();return false}}function cbName(){return"zoraAuth_"+Date.now()+Math.random().toString(36).slice(2)}function validate(idToken){return new Promise((resolve,reject)=>{const cb=cbName(),sc=document.createElement("script");let done=false,t;function clean(){clearTimeout(t);sc.remove();try{delete window[cb]}catch(e){}}window[cb]=d=>{if(done)return;done=true;clean();d&&d.success===true?resolve(d):reject(new Error(d&&d.error?d.error:"Google login tidak dapat divalidasi."))};sc.onerror=()=>{if(done)return;done=true;clean();reject(new Error("Browser tidak menerima respons login dari Google Apps Script."))};sc.src=BACKEND_URL+"?action=google_login&id_token="+encodeURIComponent(idToken)+"&callback="+cb+"&_="+Date.now();document.body.appendChild(sc);t=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error("Validasi login terlalu lama."))},30000)})}async function handleCredential(r){hideError();try{const token=String(r&&r.credential||"");if(!token)throw new Error("Google tidak mengirim ID Token.");const res=await validate(token),p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))),u=res.user||{};authToken=token;currentUser={userId:String(u.userId||p.sub||""),email:String(u.email||p.email||""),name:String(u.name||p.name||""),picture:String(u.picture||p.picture||"")};if(!currentUser.userId)throw new Error("Google User ID tidak ditemukan.");saveSession();setUser(currentUser)}catch(e){authToken="";currentUser=null;setUser(null);showError(e.message)}}function init(){if(restoreSession())return;function wait(){if(window.google&&google.accounts&&google.accounts.id){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleCredential,auto_select:false,cancel_on_tap_outside:false});google.accounts.id.renderButton($("googleLoginButton"),{type:"standard",theme:"outline",size:"large",text:"signin_with",shape:"rectangular",logo_alignment:"left",width:300});return}setTime
