function loadMemory(){try{const s=localStorage.getItem(MEMORY_KEY);if(!s)return;const d=JSON.parse(s);if(Array.isArray(d))conversationHistory=d.filter(x=>x&&(x.role==="user"||x.role==="assistant")&&typeof x.text==="string"&&x.text.trim()).slice(-MAX_HISTORY_MESSAGES)}catch(e){conversationHistory=[]}}

function formatAIResponse(t){if(!t)return"";let s=String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");s=s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre class="ai-code-block">'+c.trim()+"</pre>");s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/__(.+?)__/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>").replace(/(^|[^_])_([^_\n]+)_(?!_)/g,"$1<em>$2</em>").replace(/^###\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^##\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^#\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^\s*[-*+]\s+(.+)$/gm,'<span class="ai-bullet">• $1</span>').replace(/^\s*(\d+)\.\s+(.+)$/gm,'<span class="ai-number">$1. $2</span>').replace(/\n/g,"<br>");return s}

function callbackName(){return"zoraCallback_"+Date.now()+"_"+Math.random().toString(36).slice(2,10)}

async function sendMessage(){if(isSending)return;const q=questionInput.value.trim();if(!q)return;isSending=true;sendButton.disabled=micButton.disabled=uploadButton.disabled=true;if(welcome?.parentNode)welcome.remove();addMessage(q,"user");const h=prepareHistory(conversationHistory);questionInput.value="";autoResizeTextarea();loading.style.display="block";try{const r=await askZoraWithRetry(q,h),a=String(r.answer||"").trim();if(!a)throw new Error("ZORA mengembalikan jawaban kosong.");conversationHistory.push({role:"user",text:q},{role:"assistant",text:a});saveMemory();addMessage(a,"ai")}catch(e){addMessage("ZORA belum menerima respons dari server.\n\n"+(e.message||e),"ai")}finally{loading.style.display="none";retryStatus.style.display="none";sendButton.disabled=micButton.disabled=uploadButton.disabled=false;isSending=false;questionInput.focus()}}

function setupVoiceInput(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){micButton.onclick=()=>alert("Speech-to-Text tidak didukung browser ini. Gunakan Chrome atau Edge terbaru.");return}recognition=new SR();recognition.lang="id-ID";recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;function help(msg){voiceStatus.textContent=msg;voiceStatus.classList.add("active");voicePermission.classList.add("active");micButton.classList.add("permission-needed")}function hide(){voicePermission.classList.remove("active");micButton.classList.remove("permission-needed")}async function permission(){if(!navigator.mediaDevices?.getUserMedia){help("Browser tidak menyediakan akses microphone. Gunakan Chrome atau Edge.");return false}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());hide();return true}catch(e){help(e.name==="NotAllowedError"?"Izin microphone ditolak. Izinkan microphone melalui ikon kunci di address bar.":e.name==="NotFoundError"?"Microphone tidak ditemukan.":"ZORA tidak bisa mengakses microphone: "+e.name);return false}}voicePermissionButton.onclick=async()=>{if(await permission())voicePermissionText.textContent="Izin berhasil. Tekan 🎤 untuk mulai bicara."};recognition.onstart=()=>{isListening=true;voiceBaseText=questionInput.value.trim();micButton.classList.add("listening");micButton.textContent="⏹";voiceStatus.textContent="🎙️ Mendengarkan...";voiceStatus.classList.add("active");hide()};recognition.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;t=t.trim();if(t){questionInput.value=voiceBaseText?(voiceBaseText+" "+t):t;autoResizeTextarea()}};recognition.onerror=e=>{if(e.error==="not-allowed")help("Akses microphone ditolak. Izinkan microphone dari ikon kunci di address bar.");else if(e.error==="no-speech"){voiceStatus.textContent="Tidak terdengar suara. Coba bicara lagi.";voiceStatus.classList.add("acti /* =========================================================
   DOCUMENT UPLOAD — FINAL POST CHUNK VERSION
   =========================================================
   PENTING:
   - init/complete/status memakai GET + JSONP karena kecil.
   - DATA FILE memakai POST body, BUKAN URL.
   - Ini menghilangkan error "Browser tidak menerima respons"
     akibat base64 dimasukkan ke query URL.
   ========================================================= */

const MAX_UPLOAD_BYTES = 25 * 1024 * 1024;
const UPLOAD_CHUNK_BYTES = 64 * 1024;

const ALLOWED_UPLOAD_EXTENSIONS = [
  "pdf","txt","doc","docx","xls","xlsx","csv",
  "ppt","pptx","jpg","jpeg","png","webp"
];

let activeUploadSessionId=null;
let activePostCancel=null;

function createUploadCallback(){
  return (
    "zoraUploadCallback_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2,10)
  );
}

/*
 * GET kecil -> JSONP.
 * Dipakai untuk init, status, complete, abort.
 */
function uploadJsonp(params,timeoutMs=60000){

  return new Promise(function(resolve,reject){

    const cb = createUploadCallback();
    const script = document.createElement("script");

    let finished = false;
    let timer = null;

    function cleanup(){

      if(timer){
        clearTimeout(timer);
        timer = null;
      }

      if(script && script.parentNode){
        script.parentNode.removeChild(script);
      }

      try{
        delete window[cb];
      }catch(e){
        window[cb] = undefined;
      }
    }

    function fail(message){

      if(finished) return;

      finished = true;
      cleanup();

      reject(new Error(message));
    }

    window[cb] = function(data){

      if(finished) return;

      finished = true;
      cleanup();

      if(!data || data.success !== true){

        reject(
          new Error(
            data && data.error
              ? String(data.error)
              : "Backend upload tidak memberikan respons sukses."
          )
        );

        return;
      }

      resolve(data);
    };

    script.async = true;

    script.onerror = function(){

      fail(
        "Browser tidak menerima respons upload dari Google Apps Script."
      );
    };

    const query = new URLSearchParams();

    Object.keys(params).forEach(function(key){

      if(
        params[key] !== undefined &&
        params[key] !== null
      ){
        query.set(
          key,
          String(params[key])
        );
      }
    });

    query.set("callback",cb);
    query.set("_",String(Date.now()));

    script.src =
      BACKEND_URL +
      "?" +
      query.toString();

    document.body.appendChild(script);

    timer = setTimeout(function(){

      fail(
        "Server tidak memberikan respons dalam waktu yang ditentukan."
      );

    },timeoutMs);

  });
}

/*
 * POST chunk menggunakan HTML form + iframe.
 *
 * Tidak menggunakan fetch() karena frontend berada
 * di GitHub/Google Sites dan Apps Script tidak memberikan
 * CORS response yang bisa dibaca browser.
 *
 * Form POST lintas origin diperbolehkan browser.
 */
function postUploadChunk(sessionId,chunkIndex,totalChunks,base64Data){
  return new Promise(function(resolve,reject){
    const frameName="zoraUploadFrame_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
    const iframe=document.createElement("iframe");
    iframe.name=frameName;
    iframe.style.display="none";
    document.body.appendChild(iframe);

    const form=document.createElement("form");
    form.method="POST";
    form.action=BACKEND_URL;
    form.target=frameName;
    form.enctype="application/x-www-form-urlencoded";
    form.style.display="none";

    function addField(name,value){
      const input=document.createElement("input");
      input.type="hidden";
      input.name=name;
      input.value=value;
      form.appendChild(input);
    }

    addField("action","upload_chunk");
    addField("sessionId",sessionId);
    addField("chunkIndex",chunkIndex);
    addField("totalChunks",totalChunks);
    addField("data",base64Data);
    document.body.appendChild(form);

    let finished=false;
    const timeout=setTimeout(function(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      reject(new Error("POST chunk timeout."));
    },60000);

    function cleanup(){
      clearTimeout(timeout);
      if(form.parentNode)form.parentNode.removeChild(form);
      setTimeout(function(){if(iframe.parentNode)iframe.parentNode.removeChild(iframe)},1000);
    }

    function cancel(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      reject(new Error("UPLOAD_CANCELLED"));
    }

    activePostCancel=cancel;

    iframe.onload=function(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      resolve({success:true});
    };

    iframe.onerror=function(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      reject(new Error("POST chunk gagal dikirim ke Google Apps Script."));
    };

    form.submit();
  });
}

/*
 * Setelah POST selesai, verifikasi bahwa chunk benar-benar
 * sudah masuk ke Drive melalui upload_status.
 */
async function waitForChunk(
  sessionId,
  chunkIndex
){

  const maxAttempts = 30;

  for(
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ){

    try{

      const result =
        await uploadJsonp({
          action:"upload_status",
          sessionId:sessionId,
          chunkIndex:chunkIndex
        },30000);

      if(result.received === true){
        return result;
      }

    }catch(error){

      console.warn(
        "UPLOAD STATUS RETRY:",
        chunkIndex,
        attempt,
        error
      );
    }

    await wait(500);
  }

  throw new Error(
    "Server tidak mengonfirmasi bagian " +
    (chunkIndex + 1) +
    "."
  );
}

function arrayBufferToBase64(buffer){

  const bytes =
    new Uint8Array(buffer);

  const sliceSize = 0x8000;

  let binary = "";

  for(
    let i = 0;
    i < bytes.length;
    i += sliceSize
  ){

    const slice =
      bytes.subarray(
        i,
        Math.min(
          i + sliceSize,
          bytes.length
        )
      );

    binary +=
      String.fromCharCode.apply(
        null,
        slice
      );
  }

  return btoa(binary);
}

async function uploadFileToBackend(file){

  if(!file){
    throw new Error("File tidak dipilih.");
  }

  if(file.size <= 0){
    throw new Error("File kosong.");
  }

  if(file.size > MAX_UPLOAD_BYTES){
    throw new Error(
      "File terlalu besar. Maksimal 25 MB."
    );
  }

  const totalChunks =
    Math.ceil(
      file.size /
      UPLOAD_CHUNK_BYTES
    );

  let sessionId = null;

  try{

    /* ================================================
       INIT
       ================================================ */

    showUploadProgress(file,1);

    const init =
      await uploadJsonp({
        action:"upload_init",
        fileName:file.name,
        mimeType:
          file.type ||
          "application/octet-stream",
        fileSize:file.size,
        totalChunks:totalChunks
      });

    sessionId = init.sessionId;
    activeUploadSessionId = sessionId;

    if(uploadCancelRequested){
      throw new Error("UPLOAD_CANCELLED");
    }

    if(!sessionId){
      throw new Error(
        "Server tidak memberikan session upload."
      );
    }

    const serverChunkSize =
      Number(init.chunkSize) > 0
        ? Number(init.chunkSize)
        : UPLOAD_CHUNK_BYTES;

    /*
     * Backend V11 menggunakan 64 KB.
     * Jika server memberikan nilai lain,
     * gunakan nilai server.
     */
    const chunkSize =
      Math.min(
        serverChunkSize,
        UPLOAD_CHUNK_BYTES
      );

    const finalTotalChunks =
      Math.ceil(
        file.size /
        chunkSize
      );

    /*
     * ==============================================
     * CHUNK LOOP
     * ==============================================
     */

    for(
      let chunkIndex = 0;
      chunkIndex < finalTotalChunks;
      chunkIndex++
    ){

      if(uploadCancelRequested){
        throw new Error("UPLOAD_CANCELLED");
      }

      const start =
        chunkIndex * chunkSize;

      const end =
        Math.min(
          start + chunkSize,
          file.size
        );

      const blob =
        file.slice(
          start,
          end
        );

      const buffer =
        await blob.arrayBuffer();

      const base64 =
        arrayBufferToBase64(
          buffer
        );

      const progress =
        5 +
        (
          (chunkIndex + 1) /
          finalTotalChunks
        ) * 88;

      showUploadProgress(
        file,
        progress
      );

      let uploaded = false;
      let lastError = null;

      /*
       * Retry 3x.
       */
      for(
        let attempt = 1;
        attempt <= 3;
        attempt++
      ){

        try{

          /*
           * POST data chunk.
           */
          await postUploadChunk(
            sessionId,
            chunkIndex,
            finalTotalChunks,
            base64
          );

          if(uploadCancelRequested){
            throw new Error("UPLOAD_CANCELLED");
          }

          /*
           * Verifikasi chunk benar-benar
           * tersimpan di Drive.
           */
          await waitForChunk(
            sessionId,
            chunkIndex
          );

          uploaded = true;

          break;

        }catch(error){

          lastError = error;

          if(uploadCancelRequested){
            throw new Error("UPLOAD_CANCELLED");
          }

          console.error(
            "UPLOAD CHUNK ERROR:",
            {
              chunkIndex,
              attempt,
              error
            }
          );

          if(attempt < 3){
            await wait(
              attempt * 1000
            );
          }
        }
      }

      if(!uploaded){

        throw new Error(
          "Gagal mengupload bagian " +
          (chunkIndex + 1) +
          ". " +
          (
            lastError
              ? lastError.message
              : ""
          )
        );
      }
    }

    /* ================================================
       COMPLETE
       ================================================ */

    showUploadProgress(
      file,
      96
    );

    const result =
      await uploadJsonp({
        action:"upload_complete",
        sessionId:sessionId,
        fileName:file.name,
        mimeType:
          file.type ||
          "application/octet-stream"
      },120000);

    finishUploadUI();
    return result;

  }catch(error){

    if(sessionId){

      try{

        await uploadJsonp({
          action:"upload_abort",
          sessionId:sessionId
        },30000);

      }catch(abortError){

        console.error(
          "UPLOAD ABORT ERROR:",
          abortError
        );
      }
    }

    throw error;
  }
}

async function handleDocumentUpload(file){
  if(!file || isSending)return;

  const ext=file.name.toLowerCase().split(".").pop();

  if(!ALLOWED_UPLOAD_EXTENSIONS.includes(ext)){
    resetUploadProgress(true);
    return;
  }

  if(file.size > MAX_UPLOAD_BYTES){
    resetUploadProgress(true);
    return;
  }

  isSending=true;
  uploadCancelRequested=false;
  activeUploadSessionId=null;

  uploadButton.disabled=true;
  micButton.disabled=true;
  sendButton.disabled=true;

  showUploadProgress(file,1);

  try{
    const result=await uploadFileToBackend(file);

    /* Tidak menambahkan pesan sukses ke chat.
       File tetap tampil sebagai attachment seperti ChatGPT. */
    finishUploadUI();

    console.log("ZOYA UPLOAD SUCCESS:",result);

  }catch(error){
    console.error("ZOYA UPLOAD ERROR:",error);

    if(error && error.message==="UPLOAD_CANCELLED"){
      resetUploadProgress(true);
    }else{
      resetUploadProgress(true);
    }

  }finally{
    documentInput.value="";
    uploadButton.disabled=false;
    micButton.disabled=false;
    sendButton.disabled=false;
    isSending=false;
    activePostCancel=null;
    activeUploadSessionId=null;
    questionInput.focus();
  }
}

async function cancelCurrentUpload(){
  if(!isSending)return;

  uploadCancelRequested=true;
  uploadFileCancel.disabled=true;

  if(activePostCancel){
    try{activePostCancel()}catch(e){}
  }

  const sessionId=activeUploadSessionId;

  resetUploadProgress(true);

  if(sessionId){
    try{
      await uploadJsonp({
        action:"upload_abort",
        sessionId:sessionId
      },10000);
    }catch(error){
      console.warn("UPLOAD CANCEL CLEANUP:",error);
    }
  }
}

uploadFileCancel.onclick=cancelCurrentUpload;

function closeAttachMenu(){
  attachMenu.classList.remove("active");
  attachMenu.setAttribute("aria-hidden","true");
}
function toggleAttachMenu(){
  if(isSending) return;
  const open=attachMenu.classList.toggle("active");
  attachMenu.setAttribute("aria-hidden",open?"false":"true");
}
uploadButton.onclick=function(e){
  e.stopPropagation();
  toggleAttachMenu();
};
attachFile.onclick=function(){

  documentInput.click();
};

documentInput.onchange=function(){
