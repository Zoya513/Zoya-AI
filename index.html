<script>

const $=id=>document.getElementById(id),questionInput=$("question"),chat=$("chat"),loading=$("loading"),sendButton=$("send"),welcome=$("welcome"),retryStatus=$("retryStatus"),micButton=$("mic"),voiceStatus=$("voiceStatus"),voicePermission=$("voicePermission"),voicePermissionButton=$("voicePermissionButton"),voicePermissionText=$("voicePermissionText"),uploadButton=$("uploadButton"),attachWrap=$("attachWrap"),attachMenu=$("attachMenu"),attachImage=$("attachImage"),attachFile=$("attachFile"),attachVoice=$("attachVoice"),documentInput=$("documentInput"),imageInput=$("imageInput"),uploadAttachments=$("uploadAttachments");
function loadMemory(){try{const s=localStorage.getItem(MEMORY_KEY);if(!s)return;const d=JSON.parse(s);if(Array.isArray(d))conversationHistory=d.filter(x=>x&&(x.role==="user"||x.role==="assistant")&&typeof x.text==="string"&&x.text.trim()).slice(-MAX_HISTORY_MESSAGES); for(let i=conversationHistory.length-1;i>=0;i--){if(conversationHistory[i].role==="assistant"&&!isCreationConfirmationText(conversationHistory[i].text)){lastSubstantiveAssistantText=conversationHistory[i].text;break}}}catch(e){conversationHistory=[]}}

function formatAIResponse(t){if(!t)return"";let s=String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");s=s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre class="ai-code-block">'+c.trim()+"</pre>");s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/__(.+?)__/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>").replace(/(^|[^_])_([^_\n]+)_(?!_)/g,"$1<em>$2</em>").replace(/^###\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^##\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^#\s+(.+)$/gm,'<span class="ai-heading">$1</span>').replace(/^\s*[-*+]\s+(.+)$/gm,'<span class="ai-bullet">• $1</span>').replace(/^\s*(\d+)\.\s+(.+)$/gm,'<span class="ai-number">$1. $2</span>').replace(/\n/g,"<br>");return s}
function addMessage(text,type){const m=document.createElement("div");m.className="message "+type;if(type==="ai"){const a=document.createElement("div");a.className="avatar";m.appendChild(a)}const b=document.createElement("div");b.className="bubble";type==="ai"?b.innerHTML=formatAIResponse(text):b.textContent=String(text||"");m.appendChild(b);chat.appendChild(m);requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
function callbackName(){return"zoraCallback_"+Date.now()+"_"+Math.random().toString(36).slice(2,10)}
function askZora(question,history,attachments=[]){return new Promise((resolve,reject)=>{const cb=callbackName(),script=document.createElement("script");let done=false,timer=null;function cleanup(){if(timer)clearTimeout(timer);script.remove();try{delete window[cb]}catch(e){window[cb]=undefined}}window[cb]=data=>{if(done)return;done=true;cleanup();if(!data||data.success!==true){reject(new Error(data&&data.error?String(data.error):"Backend ZORA tidak memberikan jawaban."));return}resolve(data)};script.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error("Browser tidak menerima response dari Google Apps Script."))};const p=new URLSearchParams({q:String(question),history:JSON.stringify(prepareHistory(history)),attachments:JSON.stringify(attachments||[]),callback:cb,_:Date.now()});script.src=BACKEND_URL+"?"+p.toString();script.async=true;document.body.appendChild(script);timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error("Response ZORA terlalu lama."))},REQUEST_TIMEOUT)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function addUserMessageWithAttachments(text,attachments){

/* =========================================================
   ZORA CREATION ENGINE — DOCX / XLSX / PDF / PPTX
   + semantic edit of uploaded files
   + direct chunked download (no Google Drive tab)
========================================================= */
function detectCreationFormat(text,attachments){
  const q=String(text||"").toLowerCase();
  if(/\b(docx|word|dokumen word)\b/.test(q))return "docx";
  if(/\b(xlsx|excel|spreadsheet)\b/.test(q))return "xlsx";
  if(/\b(pdf)\b/.test(q))return "pdf";
  if(/\b(pptx|powerpoint|presentasi|slide|slides)\b/.test(q))return "pptx";
  const a=attachments&&attachments[0];
  const n=String(a&&a.fileName||"").toLowerCase();
  const m=String(a&&a.mimeType||"").toLowerCase();
  if(m.includes("wordprocessingml")||n.endsWith(".docx"))return "docx";
  if(m.includes("spreadsheetml")||n.endsWith(".xlsx"))return "xlsx";
  if(m==="application/pdf"||n.endsWith(".pdf"))return "pdf";
  if(m.includes("presentationml")||n.endsWith(".pptx"))return "pptx";
  return "";
}
function isCreationRequest(text,attachments){
  const q=String(text||"").toLowerCase().trim();
  const hasAttachment=!!(attachments&&attachments.length);

  // PENTING: kata "berikan", "buatkan", atau adanya attachment
  // TIDAK BOLEH sendirian memicu Creation Engine. Yang dinilai adalah
  // objek/output yang diminta pengguna.
  const analysisWords=/\b(analisis|analisa|jelaskan|jelaskanlah|ringkas|rangkum|baca|lihat|review|tinjau|evaluasi|cek|periksa|apa isi|isi file|kerangka kata|kerangka kalimat|cara menjelaskan|bagaimana menjelaskan|untuk mempresentasikan|presentasikan)\b/i;
  const fileFormat=/\b(pptx|powerpoint|xlsx|excel|spreadsheet|pdf|docx|word)\b/i;
  const explicitCreate=/\b(buat|buatkan|bikin|hasilkan|generate|jadikan|jadikanlah|buatlah|konversi|convert|export|ekspor|siapkan)\b/i;
  const explicitGiveFile=/\b(berikan|kirimkan|kasih)\b[\s\S]{0,80}\b(file|berkas)\b/i;
  const explicitFilePhrase=/\b(file|berkas)\b[\s\S]{0,40}\b(pptx|powerpoint|xlsx|excel|spreadsheet|pdf|docx|word)\b/i;
  const createFormatPhrase=new RegExp(
    "\\b(?:buat|buatkan|bikin|hasilkan|generate|jadikan|siapkan)\\b[\\s\\S]{0,80}\\b(?:pptx|powerpoint|xlsx|excel|spreadsheet|pdf|docx|word|presentasi|slide|slides)\\b",
    "i"
  );
  const editWords=/\b(edit|revisi|perbaiki|modifikasi|tambahkan|hapus|ganti|rapikan)\b/i;

  // Permintaan analisis/penjelasan selalu menjadi jawaban teks, kecuali
  // user secara eksplisit menyebut output file yang harus dibuat.
  const explicitOutput=
    fileFormat.test(q) && (
      explicitCreate.test(q) ||
      explicitGiveFile.test(q) ||
      explicitFilePhrase.test(q)
    ) ||
    (createFormatPhrase.test(q) && !analysisWords.test(q)) ||
    (/\b(?:buat|buatkan|bikin|hasilkan|generate|jadikan|siapkan)\b[\s\S]{0,60}\b(?:file|berkas)\b/i.test(q) && hasAttachment);

  if(editWords.test(q) && hasAttachment) return true;
  if(analysisWords.test(q) && !explicitOutput) return false;

  return !!explicitOutput;
}
function isEditRequest(text,attachments){
  if(!attachments||!attachments.length)return false;
  const q=String(text||"").toLowerCase();
  return /\b(edit|ubah|revisi|perbaiki|modifikasi|tambahkan|hapus|ganti|ubah menjadi|konversi|format ulang|rapikan)\b/.test(q);
}
function creationCallbackName(){return"zoraCreation_"+Date.now()+"_"+Math.random().toString(36).slice(2,10)}
function creationRequest(action,params,timeout){
  return new Promise(function(resolve,reject){
    const cb=creationCallbackName(),script=document.createElement("script");let done=false,timer=null;
    function cleanup(){if(timer)clearTimeout(timer);if(script.parentNode)script.parentNode.removeChild(script);try{delete window[cb]}catch(e){window[cb]=undefined}}
    window[cb]=function(data){if(done)return;done=true;cleanup();if(!data||data.success!==true){reject(new Error(data&&data.error?String(data.error):"Creation Engine tidak memberikan respons."));return}resolve(data)};
    script.onerror=function(){if(done)return;done=true;cleanup();reject(new Error("Browser tidak menerima respons Creation Engine."))};
    const p=new URLSearchParams(params||{});p.set("action",action);p.set("callback",cb);p.set("_",Date.now());script.src=BACKEND_URL+"?"+p.toString();script.async=true;document.body.appendChild(script);

async function downloadCreatedFile(data,button){

}

function isCreationConfirmationText(text){
  const s=String(text||"").trim().toLowerCase().replace(/\s+/g," ");
  if(!s)return true;
  return /^(file\s+.*\s+berhasil\s+dibuat\.?|file\s+berhasil\s+dibuat\.?|.*creation engine.*|.*tidak memiliki fitur.*menghasilkan.*xlsx.*)$/.test(s);
}
function compactCreationContext(text){
  const s=String(text||"").replace(/\r/g,"").trim();
  if(!s)return "";
  const lines=s.split("\n").map(x=>x.trim()).filter(Boolean);
  const table=lines.filter(x=>x.startsWith("|") && x.endsWith("|"));
  if(table.length){
    const title=lines.slice(0,20).filter(x=>!x.startsWith("|")).slice(0,6).join("\n");
    return (title+"\n"+table.join("\n")).slice(0,5200);
  }
  return s.slice(0,3200);
}
function findBestCreationContext(){
  if(lastSubstantiveAssistantText && !isCreationConfirmationText(lastSubstantiveAssistantText)){
    return compactCreationContext(lastSubstantiveAssistantText);
  }
  for(let i=conversationHistory.length-1;i>=0;i--){
    const x=conversationHistory[i];
    if(x&&x.role==="assistant"&&!isCreationConfirmationText(x.text)){
      return compactCreationContext(x.text);
    }
  }
  return "";
}
async function runCreationEngine(instruction,attachments){

  const params={
    format:format,
    instruction:String(instruction),
    user_id:"DEFAULT_USER",
    context:sourceMessage,
    attachments:JSON.stringify(attachments||[])
  };
  const result=await creationRequest(edit?"edit_file":"create_file",params,180000);
  return result;
}

/* =========================================================
   DOCUMENT UPLOAD — FINAL POST CHUNK VERSION
   =========================================================
   PENTING:
   - init/complete/status memakai GET + JSONP karena kecil.
   - DATA FILE memakai POST body, BUKAN URL.
   - Ini menghilangkan error "Browser tidak menerima respons"
     akibat base64 dimasukkan ke query URL.
   ========================================================= */

const MAX_UPLOAD_BYTES = 25 * 1024 * 1024;
const UPLOAD_CHUNK_BYTES = 256 * 1024;
const ALLOWED_UPLOAD_EXTENSIONS = ["pdf","txt","doc","docx","xls","xlsx","csv","ppt","pptx","jpg","jpeg","png","webp"];
let isUploading=false;
let uploadQueue=[];
let activeUpload=null;
let pendingAttachments=[];

function fileIcon(file){const ext=file.name.toLowerCase().split(".").pop();if(["jpg","jpeg","png","webp"].includes(ext))return"🖼️";if(ext==="pdf")return"📄";if(["xls","xlsx","csv"].includes(ext))return"📊";if(["doc","docx"].includes(ext))return"📝";return"📎"}
function createAttachmentCard(file){const card=document.createElement("div");card.className="upload-attachment";card.innerHTML=`<div class="upload-file-icon">${fileIcon(file)}</div><div class="upload-file-info"><div class="upload-file-name"></div><div class="upload-file-state">Menunggu...</div></div><div class="upload-file-spinner"></div><div class="upload-file-check">✓</div><button class="upload-file-cancel" type="button" aria-label="Batalkan upload" title="Batalkan">×</button>`;card.querySelector(".upload-file-name").textContent=file.name;uploadAttachments.appendChild(card);return{card,state:card.querySelector(".upload-file-state"),spinner:card.querySelector(".upload-file-spinner"),check:card.querySelector(".upload-file-check"),cancel:card.querySelector(".upload-file-cancel")}}
function setCardProgress(ui,percent){ui.card.classList.add("active");ui.state.textContent=percent>=96?"Menyiapkan file...":"Mengupload..."}

function removeCard(ui){if(ui&&ui.card&&ui.card.parentNode)ui.card.parentNode.removeChild(ui.card)}

function refreshSendState(){const busy=isSending||isUploading||uploadQueue.some(x=>x.status==="queued");sendButton.disabled=busy;micButton.disabled=busy;uploadButton.disabled=isSending}

function uploadJsonp(params, timeoutMs){
  return new Promise(function(resolve,reject){
    const cb="zoraUploadCallback_"+Date.now()+"_"+Math.random().toString(36).slice(2,10);
    const script=document.createElement("script");
    let done=false;
    let timer=null;

    function cleanup(){
      if(timer) clearTimeout(timer);
      if(script.parentNode) script.parentNode.removeChild(script);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
    }

    window[cb]=function(data){
      if(done) return;
      done=true;
      cleanup();

      if(!data || data.success!==true){
        reject(new Error(
          data && data.error
            ? String(data.error)
            : "Google Apps Script tidak memberikan respons upload yang valid."
        ));
        return;
      }

      resolve(data);
    };

    script.onerror=function(){
      if(done) return;
      done=true;
      cleanup();
      reject(new Error("Browser tidak menerima respons upload dari Google Apps Script."));
    };

    const query=new URLSearchParams();
    Object.keys(params||{}).forEach(function(key){
      const value=params[key];
      if(value!==undefined && value!==null){
        query.set(key,String(value));
      }
    });
    query.set("callback",cb);
    query.set("_",String(Date.now()));

    script.src=BACKEND_URL+"?"+query.toString();
    script.async=true;
    document.body.appendChild(script);

    timer=setTimeout(function(){
      if(done) return;
      done=true;
      cleanup();
      reject(new Error("Respons upload dari Google Apps Script terlalu lama."));
    }, Number(timeoutMs)||60000);
  });
}

async function uploadFileToBackend(file,ui){
 if(!file)throw new Error("File tidak dipilih.");if(file.size<=0)throw new Error("File kosong.");if(file.size>MAX_UPLOAD_BYTES)throw new Error("File terlalu besar. Maksimal 25 MB.");
 const totalChunks=Math.ceil(file.size/UPLOAD_CHUNK_BYTES);let sessionId=null;
 try{
  const init=await uploadJsonp({action:"upload_init",fileName:file.name,mimeType:file.type||"application/octet-stream",fileSize:file.size,totalChunks});sessionId=init.sessionId;if(!sessionId)throw new Error("Server tidak memberikan session upload.");
  const chunkSize=Math.min(Number(init.chunkSize)>0?Number(init.chunkSize):UPLOAD_CHUNK_BYTES,UPLOAD_CHUNK_BYTES);const finalTotalChunks=Math.ceil(file.size/chunkSize);
  for(let chunkIndex=0;chunkIndex<finalTotalChunks;chunkIndex++){
   if(activeUpload&&activeUpload.cancelled)throw new Error("UPLOAD_CANCELLED");
   const start=chunkIndex*chunkSize,end=Math.min(start+chunkSize,file.size),buffer=await file.slice(start,end).arrayBuffer(),base64=arrayBufferToBase64(buffer);setCardProgress(ui,5+((chunkIndex+1)/finalTotalChunks)*88);
   let uploaded=false,lastError=null;
   for(let attempt=1;attempt<=3;attempt++){try{await postUploadChunk(sessionId,chunkIndex,finalTotalChunks,base64);await waitForChunk(sessionId,chunkIndex);uploaded=true;break}catch(err){lastError=err;if(activeUpload&&activeUpload.cancelled)throw new Error("UPLOAD_CANCELLED");if(attempt<3)await wait(attempt*700)}}
   if(!uploaded)throw new Error("Gagal mengupload bagian "+(chunkIndex+1)+". "+(lastError?lastError.message:""));
  }
  setCardProgress(ui,96);const result=await uploadJsonp({action:"upload_complete",sessionId,fileName:file.name,mimeType:file.type||"application/octet-stream"},120000);finishCard(ui);return result;
 }catch(error){if(sessionId){try{await uploadJsonp({action:"upload_abort",sessionId},30000)}catch(e){}}throw error}
}

function enqueueFiles(files){
  Array.from(files||[]).forEach(file=>{
    const ext=file.name.toLowerCase().split(".").pop();
    if(!ALLOWED_UPLOAD_EXTENSIONS.includes(ext)){
      const ui=createAttachmentCard(file); failCard(ui,"Format tidak didukung."); return;
    }
    if(file.size<=0){
      const ui=createAttachmentCard(file); failCard(ui,"File kosong."); return;
    }
    if(file.size>MAX_UPLOAD_BYTES){
      const ui=createAttachmentCard(file); failCard(ui,"Maksimal 25 MB."); return;
    }
    const ui=createAttachmentCard(file);
    const item={file,ui,status:"queued",cancelled:false};
    ui.cancel.onclick=()=>cancelQueuedOrActive(item);
    uploadQueue.push(item);
  });
  refreshSendState();
  processUploadQueue();
}
async function processUploadQueue(){if(isUploading)return;const item=uploadQueue.find(x=>x.status==="queued");if(!item){refreshSendState();return}isUploading=true;item.status="uploading";activeUpload=item;refreshSendState();try{const result=await uploadFileToBackend(item.file,item.ui);if(item.cancelled)throw new Error("UPLOAD_CANCELLED");pendingAttachments.push({fileId:result.fileId,fileName:result.fileName,mimeType:result.mimeType,size:result.size,url:result.url});
    // Indexing RAG tidak menahan proses upload.
    indexKnowledgeInBackground(result.fileId,result.fileName);
    item.status="done"}catch(error){item.status=error.message==="UPLOAD_CANCELLED"?"cancelled":"error";if(error.message!=="UPLOAD_CANCELLED")failCard(item.ui,error.message||"Gagal");else removeCard(item.ui)}finally{activeUpload=null;isUploading=false;uploadQueue=uploadQueue.filter(x=>x.status!=="done"&&x.status!=="cancelled"&&x.status!=="error");documentInput.value="";imageInput.value="";refreshSendState();processUploadQueue()}}
function cancelQueuedOrActive(item){if(item.status==="queued"){item.status="cancelled";removeCard(item.ui);uploadQueue=uploadQueue.filter(x=>x!==item);refreshSendState();return}if(item.status==="uploading"&&activeUpload===item){item.cancelled=true;item.ui.cancel.disabled=true;if(activePostCancel)try{activePostCancel()}catch(e){}}}

function postUploadChunk(sessionId,chunkIndex,totalChunks,base64Data){
  return new Promise(function(resolve,reject){
    const frameName="zoraUploadFrame_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
    const iframe=document.createElement("iframe");
    iframe.name=frameName;
    iframe.style.display="none";
    document.body.appendChild(iframe);

    const form=document.createElement("form");
    form.method="POST";
    form.action=BACKEND_URL;
    form.target=frameName;
    form.enctype="application/x-www-form-urlencoded";
    form.style.display="none";

    function addField(name,value){
      const input=document.createElement("input");
      input.type="hidden";
      input.name=name;
      input.value=value;
      form.appendChild(input);
    }

    addField("action","upload_chunk");
    addField("sessionId",sessionId);
    addField("chunkIndex",chunkIndex);
    addField("totalChunks",totalChunks);
    addField("data",base64Data);
    document.body.appendChild(form);

    let finished=false;
    const timeout=setTimeout(function(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      reject(new Error("POST chunk timeout."));
    },60000);

    function cleanup(){
      clearTimeout(timeout);
      if(form.parentNode)form.parentNode.removeChild(form);
      setTimeout(function(){if(iframe.parentNode)iframe.parentNode.removeChild(iframe)},1000);
    }

    function cancel(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      reject(new Error("UPLOAD_CANCELLED"));
    }

    activePostCancel=cancel;

    iframe.onload=function(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      resolve({success:true});
    };

    iframe.onerror=function(){
      if(finished)return;
      finished=true;
      cleanup();
      if(activePostCancel===cancel)activePostCancel=null;
      reject(new Error("POST chunk gagal dikirim ke Google Apps Script."));
    };

    form.submit();
  });
}

/*
 * Setelah POST selesai, verifikasi bahwa chunk benar-benar
 * sudah masuk ke Drive melalui upload_status.
 */
async function waitForChunk(
  sessionId,
  chunkIndex
){

  const maxAttempts = 30;

  for(
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ){

    try{

      const result =
        await uploadJsonp({
          action:"upload_status",
          sessionId:sessionId,
          chunkIndex:chunkIndex
        },30000);

      if(result.received === true){
        return result;
      }

    }catch(error){

      console.warn(
        "UPLOAD STATUS RETRY:",
        chunkIndex,
        attempt,
        error
      );
    }

    await wait(500);
  }

  throw new Error(
    "Server tidak mengonfirmasi bagian " +
    (chunkIndex + 1) +
    "."
  );
}

function arrayBufferToBase64(buffer){

  const bytes =
    new Uint8Array(buffer);

  const sliceSize = 0x8000;

  let binary = "";

  for(
    let i = 0;
    i < bytes.length;
    i += sliceSize
  ){

    const slice =
      bytes.subarray(
        i,
        Math.min(
          i + sliceSize,
          bytes.length
        )
      );

    binary +=
      String.fromCharCode.apply(
        null,
        slice
      );
  }

  return btoa(binary);
}
