<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZOYA OSIN</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#fff;color:#202123}
body{display:flex;justify-content:center}
.osin{width:100%;max-width:900px;min-height:100vh;display:flex;flex-direction:column;background:#fff}
.header{height:64px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #eee;flex-shrink:0}
.logo{width:38px;height:38px;border-radius:12px;margin-right:12px;background:#111 center/270% no-repeat url("https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w1000")}
.title{font-size:18px;font-weight:600}.status{margin-left:10px;font-size:12px;color:#777}
.back{margin-left:auto;border:1px solid #e5e5e5;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px}.back:hover{background:#f5f5f5}
main{flex:1;padding:34px 22px 28px}
.card{max-width:620px;margin:70px auto 0}
.center{text-align:center}.icon{width:60px;height:60px;border-radius:18px;background:#111;margin:0 auto 18px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px}
h1{font-size:25px;margin:0 0 8px}.sub{color:#777;font-size:14px;line-height:1.5;margin:0 0 22px}
.input{width:100%;height:46px;border:1px solid #d9d9d9;border-radius:12px;padding:0 13px;font-size:15px;outline:none}.input:focus{border-color:#111}
.actions{display:flex;justify-content:center;margin-top:12px}.primary{border:0;border-radius:12px;background:#111;color:#fff;height:44px;padding:0 18px;cursor:pointer;font-weight:600}.primary:disabled{opacity:.5;cursor:not-allowed}
.error{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff2f2;color:#a00;font-size:12px}.error.active{display:block}
.search-card{max-width:760px;margin:20px auto}.search-row{display:flex;gap:8px}.search-row .input{flex:1}.mic{width:46px;height:46px;border:1px solid #d9d9d9;background:#fff;border-radius:12px;cursor:pointer}.mic.active{background:#111;color:#fff}
.statusline{margin-top:10px;font-size:12px;color:#777}.results{margin-top:22px}.empty{padding:40px 10px;text-align:center;color:#777;border:1px dashed #ddd;border-radius:14px}
.result{border:1px solid #e8e8e8;border-radius:14px;padding:15px;margin-bottom:10px}.result-title{font-weight:700;margin-bottom:10px}.field{display:grid;grid-template-columns:150px 1fr;gap:10px;margin:6px 0;font-size:13px}.label{color:#777}.value{overflow-wrap:anywhere}
.hidden{display:none!important}
@media(max-width:600px){.header{padding:0 15px}.card{margin-top:45px}main{padding:22px 15px}.search-row{align-items:center}.field{grid-template-columns:1fr}.label{margin-bottom:-5px}}
</style>
</head>
<body>
<div class="osin">
  <div class="header">
    <div class="logo"></div><div class="title">ZOYA OSIN</div><div class="status">Internal Search</div>
    <button class="back" type="button" onclick="goBackToZoya()">Kembali</button>
  </div>

  <main>
    <section id="gate" class="card">
      <div class="center">
        <div class="icon">🔒</div>
        <h1>Akses OSIN</h1>
        <p class="sub">Masukkan password OSIN untuk membuka database internal.</p>
      </div>
      <form id="gateForm">
        <input id="osinPassword" class="input" type="password" autocomplete="current-password" placeholder="Password OSIN" required>
        <div class="actions"><button id="unlockButton" class="primary" type="submit">Masuk</button></div>
        <div id="gateError" class="error"></div>
      </form>
    </section>

    <section id="searchPage" class="hidden">
      <div class="search-card">
        <h1>OSIN</h1>
        <p class="sub">Cari data yang tersedia pada database internal yang diizinkan.</p>
        <div class="search-row">
          <input id="query" class="input" type="text" placeholder="KTP, nomor telepon, email, nama, alamat, tanggal lahir..." autocomplete="off">
          <button id="voiceButton" class="mic" type="button" title="Voice to text">🎤</button>
          <button id="searchButton" class="primary" type="button">Cari</button>
        </div>
        <div id="searchStatus" class="statusline"></div><div id="indexStatus" class="statusline"></div>
        <div id="results" class="results"></div>
      </div>
    </section>
  </main>
</div>

<script>
const OSIN_BACKEND_URL="https://script.google.com/macros/s/AKfycbxKwjNmcJTZherQem5fECFHsGgNwH0QJQPqf1Zry1USALlif3iRBSy7i3wlGqWeXV0/exec";
const OSIN_SESSION_KEY="ZOYA_OSIN_SESSION_V3";
const ZOYA_AUTH_STORAGE_KEY="ZOYA_GOOGLE_SESSION_V1";
let osinSession=null;
let recognition=null;
let isListening=false;

function getZoyaSession(){
  try{
    const raw=localStorage.getItem(ZOYA_AUTH_STORAGE_KEY)||sessionStorage.getItem(ZOYA_AUTH_STORAGE_KEY);
    const data=raw?JSON.parse(raw):null;
    return data&&data.authenticated===true&&data.user&&data.user.userId?data:null;
  }catch(_){return null}
}
function getZoyaUserId(){const s=getZoyaSession();return s?String(s.user.userId||"").trim():""}
function getZoyaUser(){const s=getZoyaSession();return s?s.user:null}
function saveOsinSession(data){osinSession=data;try{sessionStorage.setItem(OSIN_SESSION_KEY,JSON.stringify(data))}catch(_){} }
function loadOsinSession(){try{const raw=sessionStorage.getItem(OSIN_SESSION_KEY);const d=raw?JSON.parse(raw):null;if(d&&d.authenticated===true)return d}catch(_){}return null}
function clearOsinSession(){osinSession=null;try{sessionStorage.removeItem(OSIN_SESSION_KEY)}catch(_){}
}
function showError(id,msg){const el=document.getElementById(id);if(!el)return;el.textContent=msg||"Terjadi kesalahan.";el.classList.toggle("active",!!msg)}
function goBackToZoya(){window.location.href=new URL("index.html",window.location.href).href}
function ensureZoyaLogin(){if(getZoyaUserId())return true;window.location.href=new URL("index.html",window.location.href).href;return false}
function jsonp(action,params,timeoutMs){
  return new Promise((resolve,reject)=>{
    if(!OSIN_BACKEND_URL||OSIN_BACKEND_URL.includes("PASTE_OSIN_BACKEND_URL_HERE")){reject(new Error("Backend OSIN belum dikonfigurasi."));return}
    const cb="zoyaOsin_"+Date.now()+"_"+Math.random().toString(36).slice(2,10),script=document.createElement("script");let done=false,timer=null;
    function cleanup(){if(timer)clearTimeout(timer);if(script.parentNode)script.parentNode.removeChild(script);try{delete window[cb]}catch(_){window[cb]=undefined}}
    window[cb]=(data)=>{if(done)return;done=true;cleanup();if(!data||data.success!==true)reject(new Error(data&&data.error?String(data.error):"Backend OSIN tidak memberikan respons."));else resolve(data)};
    script.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error("Browser tidak dapat menghubungi Backend OSIN."))};
    const p=new URLSearchParams(params||{});p.set("action",action);p.set("user_id",getZoyaUserId());p.set("callback",cb);p.set("_",Date.now());script.src=OSIN_BACKEND_URL+"?"+p.toString();script.async=true;document.body.appendChild(script);
    timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error("Backend OSIN terlalu lama merespons."))},Number(timeoutMs)||15000);
  });
}
async function verifyOsinPassword(password){
  return jsonp("osin_auth",{password:String(password||"")},15000);
}
async function validateOsinSession(){
  if(!osinSession||!osinSession.sessionToken)throw new Error("Sesi OSIN tidak valid.");
  return jsonp("validate_session",{session_token:String(osinSession.sessionToken)},15000);
}

async function searchOsin(query){
  if(!osinSession||!osinSession.sessionToken)throw new Error("Sesi OSIN tidak valid.");
  return jsonp("search",{query:String(query||""),session_token:String(osinSession.sessionToken)},30000);
}
function unlockUI(){document.getElementById("gate").classList.add("hidden");document.getElementById("searchPage").classList.remove("hidden");document.getElementById("query").focus()}
async function submitGate(event){
  event.preventDefault();if(!ensureZoyaLogin())return;
  const password=document.getElementById("osinPassword").value;const btn=document.getElementById("unlockButton");
  showError("gateError","");btn.disabled=true;btn.textContent="Memverifikasi...";
  try{const data=await verifyOsinPassword(password);saveOsinSession(data);document.getElementById("osinPassword").value="";unlockUI();refreshIndexStatus();}
  catch(e){showError("gateError",e.message||"Password OSIN salah.");}
  finally{btn.disabled=false;btn.textContent="Masuk"}
}
function renderResults(items){
  const box=document.getElementById("results");
  if(!Array.isArray(items)||!items.length){box.innerHTML='<div class="empty">Data yang dicari tidak ditemukan.</div>';return}
  box.innerHTML=items.map((item,i)=>{
    const fields=item&&item.fields&&typeof item.fields==="object"?item.fields:{};
    const rows=Object.keys(fields).map(key=>'<div class="field"><div class="label">'+escapeHtml(key)+'</div><div class="value">'+escapeHtml(fields[key])+'</div></div>').join("");
    return '<div class="result"><div class="result-title">Hasil '+(i+1)+'</div>'+rows+'<div class="field"><div class="label">Sumber</div><div class="value">'+escapeHtml(item.source||"")+'</div></div></div>';
  }).join("");
}
async function getIndexStatus(){
  if(!osinSession||!osinSession.sessionToken)return null;
  return jsonp("index_status",{session_token:String(osinSession.sessionToken)},15000);
}
async function startIndexBuild(){
  if(!osinSession||!osinSession.sessionToken)return null;
  return jsonp("index_build",{session_token:String(osinSession.sessionToken)},30000);
}
async function refreshIndexStatus(){
  try{
    const data=await getIndexStatus();
    if(!data)return;
    const st=document.getElementById("indexStatus");
    const stats=data.stats||{};
    if(data.status==="READY"){
      st.textContent="Content Index siap. File terindeks: "+String(stats.indexedFiles||0)+".";
    }else if(data.status==="BUILDING"){
      st.textContent="Content Index sedang dibangun. File terindeks: "+String(stats.indexedFiles||0)+".";
      setTimeout(refreshIndexStatus,20000);
    }else{
      st.textContent="Content Index belum tersedia. Memulai indexing database...";
      try{
        await startIndexBuild();
        setTimeout(refreshIndexStatus,8000);
      }catch(e){}
    }
  }catch(e){}
}

async function runSearch(){
  if(!ensureZoyaLogin())return;const q=document.getElementById("query").value.trim();if(!q)return;
  const btn=document.getElementById("searchButton");const status=document.getElementById("searchStatus");showError("gateError","");btn.disabled=true;status.textContent="Mencari...";
  try{const data=await searchOsin(q);renderResults(data.results||[]);status.textContent=String(data.message||((data.results||[]).length+" hasil ditemukan."));refreshIndexStatus();}
  catch(e){
    status.textContent="";
    document.getElementById("results").innerHTML='<div class="empty">'+escapeHtml(e.message||"Pencarian gagal.")+'</div>';
    if(String(e.message||"").toLowerCase().includes("sesi osin")){
      clearOsinSession();
      document.getElementById("searchPage").classList.add("hidden");
      document.getElementById("gate").classList.remove("hidden");
    }
  }
  finally{btn.disabled=false}
}
function escapeHtml(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function setupVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition)return;
  recognition=new SpeechRecognition();recognition.lang="id-ID";recognition.interimResults=false;recognition.continuous=false;
  recognition.onstart=()=>{isListening=true;document.getElementById("voiceButton").classList.add("active")};
  recognition.onend=()=>{isListening=false;document.getElementById("voiceButton").classList.remove("active")};
  recognition.onerror=()=>{isListening=false;document.getElementById("voiceButton").classList.remove("active")};
  recognition.onresult=(e)=>{const text=e.results&&e.results[0]&&e.results[0][0]?e.results[0][0].transcript:"";if(text)document.getElementById("query").value=text.trim()};
}
function toggleVoice(){if(!recognition){alert("Browser ini belum mendukung Voice to Text OSIN.");return}try{if(isListening)recognition.stop();else recognition.start()}catch(_){} }
async function restoreOsinSession(){
  if(!ensureZoyaLogin())return;
  const d=loadOsinSession();
  if(!d||d.authenticated!==true||!d.sessionToken)return;
  osinSession=d;
  try{
    await validateOsinSession();
    unlockUI();
    refreshIndexStatus();
  }catch(_){
    clearOsinSession();
  }
}

document.getElementById("gateForm").addEventListener("submit",submitGate);
document.getElementById("searchButton").addEventListener("click",runSearch);
document.getElementById("query").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
document.getElementById("voiceButton").addEventListener("click",toggleVoice);
setupVoice();restoreOsinSession();
</script>
</body>
</html>
