name: ZOYA auth UI hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html safely
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          title = '<title>ZOYA AI — FINAL Upload</title>'
          favicon = '''<title>ZOYA AI — FINAL Upload</title>\n<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w128">\n<link rel="shortcut icon" href="https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w128">\n<link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w128">'''
          if 'rel="icon"' not in s and title in s:
              s = s.replace(title, favicon, 1)

          s = s.replace('.zoya-login-btn {\n    border: 1px solid #e5e5e5;', '.zoya-login-btn {\n    display: none;\n    border: 1px solid #e5e5e5;', 1)

          if 'id="zoyaAuthPendingText"' not in s:
              s = s.replace(
                  '<div id="zoyaGoogleButton"></div>\n\n        <div class="zoya-auth-error" id="zoyaAuthError"></div>',
                  '<div id="zoyaGoogleButton"></div>\n        <div class="zoya-auth-pending" id="zoyaAuthPendingText">Menyiapkan akun…</div>\n\n        <div class="zoya-auth-error" id="zoyaAuthError"></div>',
                  1
              )
              s = s.replace(
                  '.zoya-auth-error {\n    display: none;',
                  '.zoya-auth-pending {\n    display: none;\n    margin-top: 12px;\n    color: #777;\n    font-size: 12px;\n    line-height: 1.45;\n}\n\n.zoya-auth-error {\n    display: none;',
                  1
              )
              s = s.replace(
                  'const zoyaGoogleButton =\ndocument.getElementById("zoyaGoogleButton");\n\nconst zoyaLoginButton =',
                  'const zoyaGoogleButton =\ndocument.getElementById("zoyaGoogleButton");\n\nconst zoyaAuthPendingText =\ndocument.getElementById("zoyaAuthPendingText");\n\nconst zoyaLoginButton =',
                  1
              )

          pattern = r'function updateZoyaAuthUI\(\) \{.*?\n\}\n\n\n/\* =========================================================\n   GOOGLE LOGIN'
          replacement = '''function updateZoyaAuthUI() {\n    if (zoyaAuthPending) {\n        if (zoyaAuthOverlay) zoyaAuthOverlay.style.display = "flex";\n        if (zoyaLoginButton) zoyaLoginButton.style.display = "none";\n        if (zoyaUser) zoyaUser.style.display = "none";\n        if (zoyaGoogleButton) zoyaGoogleButton.style.display = "none";\n        if (zoyaAuthPendingText) zoyaAuthPendingText.style.display = "block";\n        if (zoyaAuthError) zoyaAuthError.style.display = "none";\n        return;\n    }\n\n    if (!zoyaSession || !zoyaSession.user) {\n        if (zoyaAuthOverlay) zoyaAuthOverlay.style.display = "flex";\n        if (zoyaLoginButton) zoyaLoginButton.style.display = "inline-flex";\n        if (zoyaUser) zoyaUser.style.display = "none";\n        if (zoyaGoogleButton) zoyaGoogleButton.style.display = "flex";\n        if (zoyaAuthPendingText) zoyaAuthPendingText.style.display = "none";\n        if (typeof zoyaAuthStatusText === "function") zoyaAuthStatusText("AI Assistant");\n        return;\n    }\n\n    if (zoyaAuthOverlay) zoyaAuthOverlay.style.display = "none";\n    if (zoyaLoginButton) zoyaLoginButton.style.display = "none";\n    if (zoyaUser) zoyaUser.style.display = "flex";\n    if (zoyaGoogleButton) zoyaGoogleButton.style.display = "none";\n    if (zoyaAuthPendingText) zoyaAuthPendingText.style.display = "none";\n    if (zoyaUserPicture && zoyaSession.user.picture) {\n        zoyaUserPicture.src = zoyaSession.user.picture;\n        zoyaUserPicture.title = zoyaSession.user.email || "Akun Google";\n    }\n    if (typeof zoyaAuthStatusText === "function") zoyaAuthStatusText("AI Assistant");\n}\n\n\n/* =========================================================\n   GOOGLE LOGIN'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('AUTH UI function pattern not found')
          s = s2

          old = '''        zoyaAuthPending=true;\n        zoyaAuthOverlay.style.display="none";\n        zoyaUser.style.display="flex";\n        if(zoyaUserPicture&&payload.picture){zoyaUserPicture.src=payload.picture;}\n        zoyaUserPicture.title=payload.email||"Akun Google";\n        zoyaAuthStatusText("Menyiapkan akun…");\n        const result = await authenticateZoyaWithBackend(response.credential);'''
          new = '''        zoyaAuthPending=true;\n        updateZoyaAuthUI();\n        zoyaAuthStatusText("Menyiapkan akun…");\n        const result = await authenticateZoyaWithBackend(response.credential);'''
          if old not in s:
              raise SystemExit('pending-auth block not found')
          s = s.replace(old, new, 1)

          old = '''        saveZoyaSession(\n            zoyaSession\n        );\n\n        updateZoyaAuthUI();\n        conversationHistory=[];'''
          new = '''        saveZoyaSession(\n            zoyaSession\n        );\n\n        zoyaAuthPending=false;\n        updateZoyaAuthUI();\n        conversationHistory=[];'''
          if old not in s:
              raise SystemExit('success-auth block not found')
          s = s.replace(old, new, 1)

          old = '''        setupVoiceInput();\n\n        console.log(\n            "ZOYA LOGIN BERHASIL:",'''
          new = '''        setupVoiceInput();\n        refreshSendState();\n\n        console.log(\n            "ZOYA LOGIN BERHASIL:",'''
          if old not in s:
              raise SystemExit('post-login setup block not found')
          s = s.replace(old, new, 1)

          s = s.replace('function logoutZoya() {\n\n    clearZoyaSession();', 'function logoutZoya() {\n\n    zoyaAuthPending=false;\n    clearZoyaSession();', 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\\s\\S]*)</script>\\s*</body>', s)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/zoya.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/zoya.js

      - name: Commit patch and clean trigger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/zoya-auth-ui-hotfix.yml zoya-hotfix-trigger.txt
          git add index.html .github/workflows/zoya-auth-ui-hotfix.yml zoya-hotfix-trigger.txt
          git diff --cached --quiet || git commit -m "Fix auth state, chat unlock, and favicon"
          git push
