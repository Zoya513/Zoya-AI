name: Patch mobile UX

on:
  push:
    branches:
      - 'fix/zoya-mobile-ux-v1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zoya-mobile-ux-v1
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = 'html,body{margin:0;padding:0;width:100%;height:100%}body{font-family:Arial,sans-serif;background:#fff;color:#202123}'
          new_css = 'html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:#fff;color:#202123;overflow:hidden}'
          if old_css not in s: raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)
          old_mobile = '@media(max-width:600px){.zora{height:100vh;height:100dvh}'
          new_mobile = '@media(max-width:600px){.zora{position:fixed;inset:0;width:100%;max-width:none;height:100vh;height:100dvh;margin:0}'
          if old_mobile not in s: raise SystemExit('mobile layout anchor not found')
          s = s.replace(old_mobile, new_mobile, 1)
          old_focus = 'isSending=false;sendButton.disabled=micButton.disabled=uploadButton.disabled=false;refreshSendState();questionInput.focus()'
          new_focus = 'isSending=false;sendButton.disabled=micButton.disabled=uploadButton.disabled=false;refreshSendState();try{questionInput.focus({preventScroll:true})}catch(e){questionInput.focus()}requestAnimationFrame(()=>requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight}))'
          if old_focus not in s: raise SystemExit('focus anchor not found')
          s = s.replace(old_focus, new_focus, 1)
          old_handler = "async function handleGoogleCredential(response){hideAuthError();const token=String(response&&response.credential||\"\");if(!token){showAuthError('Google tidak mengirim ID Token.');return}try{const result=await validateGoogleLogin(token);authToken=token;const payload=decodeJwtPayload(token)||{};const user=result.user||{};currentUser={userId:String(user.userId||payload.sub||''),email:String(user.email||payload.email||''),name:String(user.name||payload.name||''),picture:String(user.picture||payload.picture||'')};if(!currentUser.userId)throw new Error('Google User ID tidak ditemukan.');localStorage.setItem('ZOYA_AI_GOOGLE_USER',JSON.stringify({email:currentUser.email,name:currentUser.name,picture:currentUser.picture,userId:currentUser.userId}));saveSession();setLoggedInUser(currentUser);conversationHistory=[];lastSubstantiveAssistantText='';loadMemory();setupVoiceInput();refreshSendState()}catch(e){authToken='';currentUser=null;authReady=false;setLoggedInUser(null);showAuthError(e.message||'Google login gagal.')}}"
          new_handler = "async function handleGoogleCredential(response){hideAuthError();const token=String(response&&response.credential||\"\");if(!token){showAuthError('Google tidak mengirim ID Token.');return}const payload=decodeJwtPayload(token)||{};const localUser={userId:String(payload.sub||''),email:String(payload.email||''),name:String(payload.name||payload.given_name||''),picture:String(payload.picture||'')};if(!localUser.userId){showAuthError('Google User ID tidak ditemukan.');return}authToken=token;currentUser=localUser;localStorage.setItem('ZOYA_AI_GOOGLE_USER',JSON.stringify({email:localUser.email,name:localUser.name,picture:localUser.picture,userId:localUser.userId}));authReady=false;if(authScreen)authScreen.style.display='none';if(authUser)authUser.style.display='flex';if(authUserName)authUserName.textContent=localUser.name||localUser.email;if(authUserAvatar){authUserAvatar.src=localUser.picture||'';authUserAvatar.style.display=localUser.picture?'block':'none'}conversationHistory=[];lastSubstantiveAssistantText='';loadMemory();setupVoiceInput();refreshSendState();try{const result=await validateGoogleLogin(token);const user=result&&result.user||{};currentUser={userId:String(user.userId||localUser.userId),email:String(user.email||localUser.email),name:String(user.name||localUser.name),picture:String(user.picture||localUser.picture)};authReady=true;saveSession();setLoggedInUser(currentUser);refreshSendState()}catch(e){authToken='';currentUser=null;authReady=false;setLoggedInUser(null);showAuthError(e.message||'Google login gagal.')}}"
          if old_handler not in s: raise SystemExit('auth handler anchor not found')
          s = s.replace(old_handler, new_handler, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate HTML JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\\s\\S]*?)</script>',s,re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/zoya-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/zoya-inline.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'NO_CHANGES'; exit 0; fi
          git commit -m 'Fix mobile login latency and chat scroll behavior'
          git push origin fix/zoya-mobile-ux-v1
