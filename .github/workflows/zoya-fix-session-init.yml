name: ZOYA Session Init Fix
on:
  push:
    branches:
      - fix/zoya-auth-safe-v3
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zoya-auth-safe-v3
          fetch-depth: 0
      - name: Fix session restore init
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='''questionInput.oninput=autoResizeTextarea;questionInput.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};sendButton.onclick=sendMessage;authLogout.onclick=logoutGoogle;const hasSession=restoreSession();if(hasSession){setLoggedInUser(null);loadMemory();setupVoiceInput();refreshSendState();initGoogleLogin()}else{setLoggedInUser(null);initGoogleLogin()}window.addEventListener("pointerdown",touchSession,{passive:true});window.addEventListener("keydown",touchSession,{passive:true});console.log("ZOYA AI V12 + SAFE 5-DAY SESSION + NATURAL FILE INTENT");'''
          new='''questionInput.oninput=autoResizeTextarea;questionInput.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};sendButton.onclick=sendMessage;authLogout.onclick=logoutGoogle;const hasSession=restoreSession();if(hasSession){setLoggedInUser(currentUser);loadMemory();setupVoiceInput();refreshSendState();initGoogleLogin()}else{setLoggedInUser(null);initGoogleLogin()}window.addEventListener("pointerdown",touchSession,{passive:true});window.addEventListener("keydown",touchSession,{passive:true});console.log("ZOYA AI V12 + SAFE 5-DAY SESSION + NATURAL FILE INTENT");'''
          if old not in s: raise SystemExit('session init block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const m=html.match(/<script>([\s\S]*)<\/script>/); if(!m) throw new Error('script block not found'); fs.writeFileSync('/tmp/zoya.js',m[1]);
          NODE
          node --check /tmp/zoya.js
      - name: Commit and force update branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix restored session initialization'
          git push --force origin fix/zoya-auth-safe-v3
