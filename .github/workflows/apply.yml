name: Apply mobile patch
on:
  push:
    branches: ['fix/zoya-mobile-ux-v2']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_mobile.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/zoya.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/zoya.js
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm patch_mobile.py .github/workflows/apply.yml .github/workflows/test.yml || true
          git commit -m 'Fix mobile login latency and chat scroll behavior'
          git push origin fix/zoya-mobile-ux-v2
