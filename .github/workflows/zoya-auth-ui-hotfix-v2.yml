name: ZOYA auth UI hotfix v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply auth, chat, favicon patch
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          title='<title>ZOYA AI — FINAL Upload</title>'
          if 'rel="icon"' not in s and title in s:
              s=s.replace(title, title+'\n<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w128">\n<link rel="shortcut icon" href="https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w128">\n<link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w128">',1)

          s=s.replace('.zoya-login-btn {\n    border: 1px solid #e5e5e5;','.zoya-login-btn {\n    display: none;\n    border: 1px solid #e5e5e5;',1)

          if 'id="zoyaAuthPendingText"' not in s:
              s=s.replace('<div id="zoyaGoogleButton"></div>\n\n        <div class="zoya-auth-error" id="zoyaAuthError"></div>', '<div id="zoyaGoogleButton"></div>\n        <div class="zoya-auth-pending" id="zoyaAuthPendingText">Menyiapkan akun…</div>\n\n        <div class="zoya-auth-error" id="zoyaAuthError"></div>',1)
              s=s.replace('.zoya-auth-error {\n    display: none;','.zoya-auth-pending {\n    display:none;\n    margin-top:12px;\n    color:#777;\n    font-size:12px;\n    line-height:1.45;\n}\n\n.zoya-auth-error {\n    display: none;',1)
              s=s.replace('const zoyaGoogleButton =\ndocument.getElementById("zoyaGoogleButton");\n\nconst zoyaLoginButton =','const zoyaGoogleButton =\ndocument.getElementById("zoyaGoogleButton");\n\nconst zoyaAuthPendingText =\ndocument.getElementById("zoyaAuthPendingText");\n\nconst zoyaLoginButton =',1)

          pattern=r'function updateZoyaAuthUI\(\) \{.*?\n\}\n\n\n/\* =========================================================\n   GOOGLE LOGIN'
          replacement='''function updateZoyaAuthUI() {\n    if (zoyaAuthPending) {\n        if (zoyaAuthOverlay) zoyaAuthOverlay.style.display = "flex";\n        if (zoyaLoginButton) zoyaLoginButton.style.display = "none";\n        if (zoyaUser) zoyaUser.style.display = "none";\n        if (zoyaGoogleButton) zoyaGoogleButton.style.display = "none";\n        if (zoyaAuthPendingText) zoyaAuthPendingText.style.display = "block";\n        if (zoyaAuthError) zoyaAuthError.style.display = "none";\n        return;\n    }\n    if (!zoyaSession || !zoyaSession.user) {\n        if (zoyaAuthOverlay) zoyaAuthOverlay.style.display = "flex";\n        if (zoyaLoginButton) zoyaLoginButton.style.display = "inline-flex";\n        if (zoyaUser) zoyaUser.style.display = "none";\n        if (zoyaGoogleButton) zoyaGoogleButton.style.display = "flex";\n        if (zoyaAuthPendingText) zoyaAuthPendingText.style.display = "none";\n        if (typeof zoyaAuthStatusText === "function") zoyaAuthStatusText("AI Assistant");\n        return;\n    }\n    if (zoyaAuthOverlay) zoyaAuthOverlay.style.display = "none";\n    if (zoyaLoginButton) zoyaLoginButton.style.display = "none";\n    if (zoyaUser) zoyaUser.style.display = "flex";\n    if (zoyaGoogleButton) zoyaGoogleButton.style.display = "none";\n    if (zoyaAuthPendingText) zoyaAuthPendingText.style.display = "none";\n    if (zoyaUserPicture && zoyaSession.user.picture) {\n        zoyaUserPicture.src = zoyaSession.user.picture;\n        zoyaUserPicture.title = zoyaSession.user.email || "Akun Google";\n    }\n    if (typeof zoyaAuthStatusText === "function") zoyaAuthStatusText("AI Assistant");\n}\n\n\n/* =========================================================\n   GOOGLE LOGIN'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('auth ui function not found')

          pending_pattern=r'zoyaAuthPending=true;[\s\S]{0,500}?const result = await authenticateZoyaWithBackend\(response\.credential\);'
          pending_repl='''zoyaAuthPending=true;\n        updateZoyaAuthUI();\n        zoyaAuthStatusText("Menyiapkan akun…");\n        const result = await authenticateZoyaWithBackend(response.credential);'''
          s,n=re.subn(pending_pattern,pending_repl,s,count=1)
          if n!=1: raise SystemExit('pending auth sequence not found')

          success_pattern=r'saveZoyaSession\(\s*zoyaSession\s*\);\s*updateZoyaAuthUI\(\);\s*conversationHistory=\[\];'
          success_repl='''saveZoyaSession(\n            zoyaSession\n        );\n\n        zoyaAuthPending=false;\n        updateZoyaAuthUI();\n        conversationHistory=[];'''
          s,n=re.subn(success_pattern,success_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('success auth sequence not found')

          post_pattern=r'setupVoiceInput\(\);\s*console\.log\(\s*"ZOYA LOGIN BERHASIL:",'
          post_repl='''setupVoiceInput();\n        refreshSendState();\n\n        console.log(\n            "ZOYA LOGIN BERHASIL:",'''
          s,n=re.subn(post_pattern,post_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('post login sequence not found')

          s=s.replace('function logoutZoya() {\n\n    clearZoyaSession();','function logoutZoya() {\n\n    zoyaAuthPending=false;\n    clearZoyaSession();',1)
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
      - name: Commit and clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/zoya-auth-ui-hotfix-v2.yml zoya-hotfix-trigger-v2.txt
          git add index.html .github/workflows/zoya-auth-ui-hotfix-v2.yml zoya-hotfix-trigger-v2.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix auth transition, chat unlock, and favicon"
          git push
