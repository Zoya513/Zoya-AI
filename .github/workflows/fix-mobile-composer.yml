name: One-time mobile composer fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile viewport and composer
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'ZOYA MOBILE COMPOSER FIX 2026-08-16'

          old_meta = '<meta name="viewport" content="width=device-width,initial-scale=1.0">'
          new_meta = '<meta name="viewport" content="width=device-width,initial-scale=1.0,interactive-widget=resizes-content">'
          if old_meta in text:
              text = text.replace(old_meta, new_meta, 1)
          elif 'interactive-widget=' not in text:
              raise SystemExit('Viewport meta tag not found; aborting without changing index.html')

          if marker not in text:
              css = '''\n/* ZOYA MOBILE COMPOSER FIX 2026-08-16 */\n@media(max-width:600px){\n  .zora{min-height:0;}\n  .chat{min-height:0;padding-bottom:120px;}\n  .input-area{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#fff;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}\n}\n'''
              text = text.replace('</style>', css + '</style>', 1)

              js = '''\n<script>\n/* ZOYA MOBILE COMPOSER FIX 2026-08-16 */\n(function(){\n  const input = document.getElementById('question');\n  const composer = document.querySelector('.input-area');\n  const chat = document.getElementById('chat');\n  if(!input || !composer || !chat) return;\n\n  const vv = window.visualViewport;\n  let raf = 0;\n\n  function syncMobileKeyboard(){\n    cancelAnimationFrame(raf);\n    raf = requestAnimationFrame(function(){\n      const keyboard = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;\n      composer.style.setProperty('--zora-keyboard-offset', keyboard + 'px');\n      if(keyboard > 80){\n        composer.style.bottom = keyboard + 'px';\n      }else{\n        composer.style.bottom = '0px';\n      }\n      const h = composer.getBoundingClientRect().height || 90;\n      chat.style.paddingBottom = (h + 24) + 'px';\n    });\n  }\n\n  function keepLatestVisible(){\n    requestAnimationFrame(function(){\n      const last = chat.lastElementChild;\n      if(last) last.scrollIntoView({block:'nearest',inline:'nearest'});\n      syncMobileKeyboard();\n    });\n  }\n\n  input.addEventListener('focus', function(){\n    syncMobileKeyboard();\n    setTimeout(keepLatestVisible, 120);\n    setTimeout(keepLatestVisible, 350);\n  }, {passive:true});\n\n  if(vv){\n    vv.addEventListener('resize', syncMobileKeyboard);\n    vv.addEventListener('scroll', syncMobileKeyboard);\n  }\n  window.addEventListener('resize', syncMobileKeyboard);\n  syncMobileKeyboard();\n})();\n</script>\n'''
              text = text.replace('</body>', js + '</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-mobile-composer.yml
          git rm .github/workflows/fix-mobile-composer.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix: keep mobile composer visible with keyboard"
          git push