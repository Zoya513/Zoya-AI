name: Connect ZOYA History

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          blob = ''
          open('/tmp/zoya-history.patch','wb').write(gzip.decompress(base64.b64decode(blob)))
          PY
          git apply --check /tmp/zoya-history.patch
          git apply /tmp/zoya-history.patch
          test "$(grep -o 'HISTORY_BACKEND_URL' index.html | wc -l)" -eq 1
          test "$(grep -o '</html>' index.html | wc -l)" -eq 1

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/zoya-main.js').write_text('

'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/zoya-main.js

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ZOYA History Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Connect separate ZOYA history UI and backend"
          git rm .github/workflows/connect-history.yml
          git commit -m "Remove temporary history patch workflow"
          git push
